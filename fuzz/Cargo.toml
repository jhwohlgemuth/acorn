[package]
name = "acorn-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
acorn-core = { path = "../crates/acorn-core" }
acorn-lib = { path = "../crates/acorn-lib", features = ["powerpoint"] }
acorn-schema = { path = "../crates/acorn-schema" }
libfuzzer-sys = "0.4"
serde_json = "1"
serde_norway = "0.9.42"

[[bin]]
name = "location_repository"
path = "fuzz_targets/location_repository.rs"
test = false
doc = false
bench = false

[[bin]]
name = "powerpoint"
path = "fuzz_targets/powerpoint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "research_activity"
path = "fuzz_targets/research_activity.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
