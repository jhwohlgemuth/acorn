# Reusable scheduled PowerAutomate artifact-creation job for ACORN bucket projects.
powerautomate-report:
  stage: .post
  image:
    name: savannah.ornl.gov/research-enablement/acorn/runner:latest
    entrypoint: [""]
  interruptible: false
  resource_group: acorn-powerautomate-reporting
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $ACORN_POWER_AUTOMATE_REPORTING == "true"'
    - when: never
  script:
    - export ACORN_REPORT_THROUGH="$(date -u +%Y-%m-01T00:00:00Z)"
    - acorn report --config "${ACORN_REPORT_CONFIG:-.acorn.json}" --root . --output .acorn/reports
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - .acorn/reports/
