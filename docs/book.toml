[book]
authors = ["Jason Wohlgemuth", "Audrey Carson"]
language = "en"
src = "src"
title = "🌱 Plant an acorn, grow your science"
text-direction = "ltr"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "rust"
additional-css = ["acorn-docs.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js", "artifact-logos.js", "schema-tree.js"]
mathjax-support = true

[output.html.fold]
enable = true
level = 0

[output.html.playground]
editable = false
copyable = true
line-numbers = false
runnable = true

[preprocessor.mermaid]
[preprocessor.pikchr]
