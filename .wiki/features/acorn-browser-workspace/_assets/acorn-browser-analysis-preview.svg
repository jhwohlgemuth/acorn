    <g transform="translate(172)">
      <text y="80" class="title">Check readability</text>
      <text y="102" class="muted">Measure one supported metric at a time.</text>
      <text y="142" class="eyebrow">METRIC</text>
      <rect y="154" width="318" height="38" rx="7" fill="#252931" stroke="#3c414e"/>
      <text x="14" y="178" class="body">Flesch Reading Ease</text>
      <text x="302" y="178" class="muted">&#x2304;</text>
      <text y="222" class="eyebrow">PROSE</text>
      <rect y="234" width="318" height="206" rx="9" fill="#181b21" stroke="#3c414e"/>
      <text x="14" y="260" class="body">ACORN validates and transforms research</text>
      <text x="14" y="281" class="body">activity data locally. The workspace keeps</text>
      <text x="14" y="302" class="body">content in memory and makes every result</text>
      <text x="14" y="323" class="body">available to keyboard and screen readers.</text>
      <text x="14" y="419" class="muted">184 words &#xB7; 1,126 / 16,384 bytes</text>
      <rect y="458" width="318" height="32" rx="7" fill="#00662c"/>
      <text x="159" y="479" fill="#fff" font-size="10" font-weight="650" text-anchor="middle">Analyze readability</text>
      <rect y="510" width="318" height="180" rx="10" fill="#252931" stroke="#3c414e"/>
      <text x="18" y="538" class="eyebrow">FLESCH READING EASE</text>
      <text x="18" y="590" fill="#f3f6f4" font-size="42" font-weight="700">58.2</text>
      <rect x="220" y="555" width="80" height="26" rx="13" fill="#3a3021"/>
      <text x="260" y="572" fill="#e8b85c" font-size="10" font-weight="650" text-anchor="middle">Needs review</text>
      <line x1="18" x2="300" y1="608" y2="608" stroke="#3c414e"/>
      <text x="18" y="633" class="body">Target threshold</text>
      <text x="300" y="633" class="label" text-anchor="end">60&#x2013;70</text>
      <text x="18" y="657" class="muted">Fairly difficult. Shorten long sentences and</text>
      <text x="18" y="675" class="muted">prefer familiar words where precision allows.</text>
      <text x="159" y="728" class="muted" text-anchor="middle">Made with &#x2665; by jhwohlgemuth</text>
    </g>
  </g>
