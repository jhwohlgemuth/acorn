<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title description">
  <title id="title">ACORN identifier discovery and inspection previews</title>
  <desc id="description">Two dark ACORN workspace previews for discovering persistent identifiers in text and inspecting one identifier, including normalized results, counts, truncation state, explicit kind selection, and deterministic valid, invalid, or ambiguous outcomes.</desc>
