<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title description">
  <title id="title">ACORN validation and crosswalk page previews</title>
  <desc id="description">Dark desktop previews for Research Activity validation, metadata-standard validation, and metadata crosswalk routes. Each page uses the shared OKF-inspired ACORN shell, local content controls, structured results, and ORNL-inspired green actions.</desc>
