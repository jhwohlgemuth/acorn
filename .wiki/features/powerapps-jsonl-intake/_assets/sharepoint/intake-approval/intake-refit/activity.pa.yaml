- EntryForm:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      AlignInContainer: =AlignInContainer.Center
      Fill: =Color.White
      FillPortions: =0
      Height: =SectionDetails.Height + SubmissionContext.Height + PlacementLabel.Height + PlacementChoice.Height + ProjectLabel.Height + ProjectDropdown.Height + ProjectHelp.Height + RefreshProjectsButton.Height + DateLabel.Height + OccurredOnPicker.Height + CategoryLabel.Height + CategoryChoice.Height + StateLabel.Height + StateChoice.Height + EventLabel.Height + EventChoice.Height + SectionStory.Height + SummaryLabel.Height + SummaryNarrative.Height + SummaryCount.Height + ItemsLabel.Height + DetailsNarrative.Height + ItemsHelp.Height + ValidationSummary.Height + ReportCardPreview.Height + ReviewNote.Height + Self.PaddingTop + Self.PaddingBottom + Self.LayoutGap * 25
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =6
      LayoutMinHeight: =Self.Height
      LayoutMinWidth: =0
      PaddingBottom: =24
      PaddingLeft: =If(Parent.Width < 700, 16, 32)
      PaddingRight: =If(Parent.Width < 700, 16, 32)
      PaddingTop: =24
      RadiusBottomLeft: =12
      RadiusBottomRight: =12
      RadiusTopLeft: =12
      RadiusTopRight: =12
      Width: =Min(880, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight)
    Children:
      - SectionDetails:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#007833")
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =28
            LayoutMinHeight: =28
            LayoutMinWidth: =0
            OnSelect: =
            Size: =10
            Text: ="01  //  HIGHLIGHT DETAILS"
      - SubmissionContext:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            Color: =ColorValue("#52685F")
            Font: =Font.'Segoe UI'
            Height: =32
            LayoutMinHeight: =32
            LayoutMinWidth: =0
            OnSelect: =
            Size: =11
            Text: =If(!IsBlank(varCorrectionParent), "CORRECTION // Original receipt retained. Project and report placement stay fixed.", "Submitted by " & User().FullName)
      - PlacementLabel:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#123B31")
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =28
            LayoutMinHeight: =28
            LayoutMinWidth: =0
            OnSelect: =
            Size: =12
            Text: ="Report placement *"
      - PlacementDropdown:
          Control: Classic/DropDown@2.3.1
          Properties:
            AccessibleLabel: ="Report placement"
            BorderColor: =ColorValue("#B7C9C0")
            BorderThickness: =1
            ChevronBackground: =ColorValue("#EDF4EF")
            ChevronFill: =ColorValue("#007833")
            Color: =ColorValue("#123B31")
            Default: =PlacementChoice.SelectedKey
            DisplayMode: =If(!IsBlank(varCorrectionParent), DisplayMode.Disabled, If(varSubmitting || !IsBlank(varPendingJson), DisplayMode.Disabled, DisplayMode.Edit))
            Fill: =Color.White
            FocusedBorderThickness: =2
            Font: =Font.'Segoe UI'
            Height: =44
            HoverBorderColor: =ColorValue("#007833")
            HoverFill: =ColorValue("#F0F7F2")
            Items: =["Project highlight","Report-wide update (no associated project)"]
            Items.Value: =Value
            LayoutMinHeight: =44
            LayoutMinWidth: =0
            SelectionColor: =ColorValue("#123B31")
            SelectionFill: =ColorValue("#D9EDDF")
            Size: =12
            Visible: =false
      - PlacementChoice:
          Control: CanvasComponent
          ComponentName: cmpSegmentedChoice
          ComponentLibraryUniqueName: cr1d0_sponsorhighlightsuitestonly_cf112
          Properties:
            AccessibleLabel: ="Report placement, required"
            Choices: |-
              =Table({Key: "Project highlight", Label: "Project highlight"}, {Key: "Report-wide update (no associated project)", Label: "Report-wide update (no associated project)"})
            DefaultKey: =If(!IsBlank(varRestoredDraft) && Boolean(varRestoredDraft.entry.global), "Report-wide update (no associated project)", "Project highlight")
            Disabled: =varSubmitting || !IsBlank(varPendingJson)
            ErrorText: =""
            Height: =If(App.Width < 500, 96, 48)
            HelpText: ="Choose where this highlight appears in the report."
            Label: ="Report placement"
            LayoutMinWidth: =0
            OnChange: =Reset(PlacementDropdown)
            Required: =true
      - ProjectLabel:
          Control: Label@2.5.1
          Properties:
            Color: =ColorValue("#123B31")
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =28
            LayoutMinHeight: =28
            LayoutMinWidth: =0
            OnSelect: =
            Size: =12
            Text: =If(PlacementDropdown.Selected.Value = "Project highlight", "Project *", "Project · project highlights only")
      - ProjectDropdown:
          Control: Classic/DropDown@2.3.1
          Properties:
            AccessibleLabel: =If(PlacementDropdown.Selected.Value = "Project highlight", "Project, required", "Project, available for project highlights only")
            BorderColor: =ColorValue("#B7C9C0")
            BorderThickness: =1
            ChevronBackground: =ColorValue("#EDF4EF")
            ChevronFill: =ColorValue("#007833")
            Color: =ColorValue("#123B31")
            Default: =Coalesce(varPendingProjectLabel, "Select a project")
            DisplayMode: =If(!IsBlank(varCorrectionParent), DisplayMode.Disabled, If(PlacementDropdown.Selected.Value <> "Project highlight" || varSubmitting || varProjectsLoading || !varCatalogLoaded || CountRows(colProjects) <= 1 || !IsBlank(varPendingJson), DisplayMode.Disabled, DisplayMode.Edit))
            Fill: =Color.White
            FocusedBorderThickness: =2
            Font: =Font.'Segoe UI'
            Height: =44
            HoverBorderColor: =ColorValue("#007833")
            HoverFill: =ColorValue("#F0F7F2")
            Items: =Filter(colProjects, !IsBlank(varPendingJson) || (PlacementDropdown.Selected.Value = "Project highlight" && ProjectId <> "general"))
            Items.Value: =Value
            LayoutMinHeight: =44
            LayoutMinWidth: =0
            SelectionColor: =ColorValue("#123B31")
            SelectionFill: =ColorValue("#D9EDDF")
            Size: =12
      - ProjectHelp:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            Color: '=If(!IsBlank(varProjectCatalogError), ColorValue("#7A3E00"), ColorValue("#52685F"))  '
            Fill: '=If(!IsBlank(varProjectCatalogError), ColorValue("#FFF4E5"), Color.Transparent)  '
            Font: =Font.'Segoe UI'
            Height: =44
            LayoutMinHeight: =44
            LayoutMinWidth: =0
            Live: '=Live.Assertive  '
            OnSelect: =
            Size: '=12  '
            Text: =If(!IsBlank(varCorrectionParent), "This correction stays with " & varEditingProjectId & ". Project and report placement cannot be changed here.", If(!IsBlank(varPendingJson), "This highlight belongs to " & varPendingProjectLabel & ". The project is fixed for this submission.", PlacementDropdown.Selected.Value = "Report-wide update (no associated project)", "Use this for program- or organization-wide updates with no associated project. Updates about a specific project belong under Project highlight, even when broad in scope.", PlacementDropdown.Selected.Value <> "Project highlight", "Choose report placement first. Select Project highlight to load and choose a project.", varProjectsLoading, "Loading projects…", !IsBlank(varProjectCatalogError), varProjectCatalogError, !varCatalogLoaded, "Load the available projects to get started.", CountRows(colProjects) <= 1, "No projects are available yet. Contact the app owner.", IsBlank(ProjectDropdown.Selected.ProjectId), "Choose the project this highlight belongs to.", "This highlight belongs to " & ProjectDropdown.Selected.Value & "."))
      - RefreshProjectsButton:
          Control: Classic/Button@2.2.0
          Properties:
            AlignInContainer: =AlignInContainer.Start
            BorderColor: =ColorValue("#B7C9C0")
            Color: =ColorValue("#007833")
            DisplayMode: =If(!IsBlank(varCorrectionParent), DisplayMode.Disabled, If(PlacementDropdown.Selected.Value <> "Project highlight" || varProjectsLoading || varSubmitting || !IsBlank(varPendingJson), DisplayMode.Disabled, DisplayMode.Edit))
            Fill: =ColorValue("#EDF4EF")
            FocusedBorderColor: =ColorValue("#123B31")
            FocusedBorderThickness: =3
            Font: =Font.'Segoe UI'
            Height: =36
            HoverColor: =ColorValue("#123B31")
            HoverFill: =ColorValue("#D9EDDF")
            LayoutMinHeight: =36
            LayoutMinWidth: =0
            OnSelect: "=If(PlacementDropdown.Selected.Value = \"Project highlight\" && !varProjectsLoading && !varSubmitting && IsBlank(varPendingJson),\n    Set(varProjectsLoading, true); Set(varProjectCatalogError, \"\"); Set(varCatalogLoaded, false);\n    ClearCollect(colProjects, {Value: \"Select a project\", ProjectId: \"\"});\n    ClearCollect(colCatalogCandidate, {Value: \"\", ProjectId: \"\", ValidTypes: true}); Clear(colCatalogCandidate);\n    Set(varProjectCatalogResponse, IfError(\n        ACORNSharePointPilotCatalog.Run(),\n        Set(varProjectCatalogError, If(FirstError.Details.HttpStatusCode in [401, 403],\n            \"Project access was denied. Ask the app owner to check your form access and the catalog connection, then retry.\",\n            \"The project service could not be reached. Check your connection and retry. If this continues, contact the app owner.\")); {catalogjson: \"\"}\n    ));\n    If(IsBlank(varProjectCatalogError),\n        IfError(\n            With({catalog: ParseJSON(varProjectCatalogResponse.catalogjson)},\n                If(!IsBlank(Text(catalog.error)),\n                    Set(varProjectCatalogError, Switch(Text(catalog.error),\n                        \"access_denied\", \"Project access was denied. Ask the app owner to check your form access and the catalog connection, then retry.\",\n                        \"catalog_limit\", \"The project list exceeds the supported limit. Contact the app owner; no projects were loaded.\",\n                        \"unavailable\", \"The project service is temporarily unavailable. Retry shortly. If this continues, contact the app owner.\",\n                        \"The project list could not be verified. Retry, or contact the app owner if this continues.\")),\n                    Text(catalog.source) <> \"sharepoint\" || !StartsWith(TrimEnds(JSON(catalog.projects)), \"[\"),\n                    Set(varProjectCatalogError, \"The project list could not be verified. Retry, or contact the app owner if this continues.\"),\n                    ClearCollect(colCatalogCandidate, ForAll(Table(catalog.projects), {Value: Text(ThisRecord.Value.label), ProjectId: Text(ThisRecord.Value.id), ValidTypes: StartsWith(JSON(ThisRecord.Value.id), Char(34)) && StartsWith(JSON(ThisRecord.Value.label), Char(34))}));\n                    If(CountRows(colCatalogCandidate) > 1000 ||\n                       CountRows(Distinct(colCatalogCandidate, ProjectId)) <> CountRows(colCatalogCandidate) ||\n                       CountIf(colCatalogCandidate, !ValidTypes || IsBlank(TrimEnds(Value)) || IsBlank(TrimEnds(ProjectId)) || Len(Value) > 512 || Len(ProjectId) > 512) > 0,\n                        Set(varProjectCatalogError, \"The project list could not be verified. Retry, or contact the app owner if this continues.\"),\n                        IsEmpty(colCatalogCandidate),\n                        Set(varProjectCatalogError, \"No projects are available yet. Ask the app owner to update the project list, then retry.\"),\n                        Collect(colProjects, ShowColumns(colCatalogCandidate, Value, ProjectId)); Set(varCatalogLoaded, true); Set(varCatalogEverLoaded, true)\n                    )\n                )\n            ); true,\n            Set(varProjectCatalogError, \"The project list could not be verified. Retry, or contact the app owner if this continues.\"); false\n        )\n    );\n    If(!varCatalogLoaded, ClearCollect(colProjects, {Value: \"Select a project\", ProjectId: \"\"}));\n    Clear(colCatalogCandidate); Set(varProjectsLoading, false); Reset(ProjectDropdown)\n)\n    "
            Size: =11
            Text: '=If(varProjectsLoading, "Loading projects…", !IsBlank(varProjectCatalogError), "Retry Project List", Coalesce(varCatalogEverLoaded, false), "Refresh Project List", "Load Project List") '
            Width: =180
