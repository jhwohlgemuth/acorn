                                    OnSelect: "=If(\n  varLiveReviewMode,\n  With({item: LookUp(colReviewDrafts, id = varReviewId)},\n    If(\n      IsBlank(item.sourceItemId),\n      Set(varLiveSaveMessage, \"Select a live review item first.\"),\n      item.decision = \"exclude\" && IsBlank(Trim(item.exclusionReason)),\n      Set(varLiveSaveMessage, \"Add an exclusion reason before saving.\"),\n      Set(varLiveSaveMessage, \"Saving…\");\n      IfError(\n        Set(varLiveSaveResponse,\n          SaveApprovalItemTESTONLY.Run({text: JSON({\n            batchId: varLedgerBatchId,\n            sourceItemId: Text(item.sourceItemId),\n            expectedItemETag: item.itemETag,\n            expectedDraftVersion: Text(item.draftVersion),\n            summary: Trim(item.summary),\n            decision: item.decision,\n            decisionReason: Trim(item.exclusionReason)\n          }, JSONFormat.Compact)})\n        );\n        Switch(\n          Lower(Text(varLiveSaveResponse.status)),\n          \"saved\",\n          With({saved: ParseJSON(Text(varLiveSaveResponse.itemjson))},\n            UpdateIf(colReviewDrafts, id = varReviewId, {\n              itemETag: Coalesce(Text(saved.itemETag), Text(saved.'@odata.etag')),\n              draftVersion: Coalesce(Value(saved.draftVersion), Value(saved.DraftVersion)), savedDecision: item.decision\n            });\n            Set(varLiveSaveMessage, \"Saved to review ledger.\"); If(item.decision=\"approve\",Select(ReviewAiGenerate))\n          ),\n          \"unchanged\",\n          With({saved: ParseJSON(Text(varLiveSaveResponse.itemjson))},\n            UpdateIf(colReviewDrafts, id = varReviewId, {\n              itemETag: Coalesce(Text(saved.itemETag), Text(saved.'@odata.etag')),\n              draftVersion: Coalesce(Value(saved.draftVersion), Value(saved.DraftVersion)), savedDecision: item.decision\n            });\n            Set(varLiveSaveMessage, \"Saved; exact reread confirmed no change.\"); If(item.decision=\"approve\",Select(ReviewAiGenerate))\n          ),\n          \"conflict\", Set(varLiveSaveMessage, \"Conflict: another reviewer saved first. Your local edit is retained; reload and compare before retrying.\"),\n          \"invalid\", Set(varLiveSaveMessage, \"Review validation failed. Your local edit is retained.\"),\n          \"batch-not-ready\", Set(varLiveSaveMessage, \"This batch is locked. Your local edit is retained.\"),\n          Set(varLiveSaveMessage, \"The save could not be confirmed. Your local edit is retained.\")\n        ),\n        Set(varLiveSaveMessage, \"The save could not be confirmed. Your local edit is retained.\")\n      )\n    )\n  ),\n  Set(varReviewId, Coalesce(First(Filter(colReviewDrafts, id <> varReviewId && (decision = \"unresolved\" || (decision = \"exclude\" && IsBlank(Trim(exclusionReason)))))).id, varReviewId));\n  Set(varJumpProject, LookUp(colReviewDrafts, id = varReviewId).projectId);\n  Reset(ReviewState); Reset(ReviewGallery)\n)       "
