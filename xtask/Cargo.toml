[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
description = "Repository maintenance, application packaging, and release publication tasks"

[dependencies]
reqwest = { version = "0.13.2", features = ["blocking", "rustls"], default-features = false }
semver = "1"
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = "0.10.9"
toml_edit = "0.22"
zip = { version = "8.5.1", features = ["deflate"], default-features = false }

[dev-dependencies]
tempfile = "3"
