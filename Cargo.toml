[workspace]
members = ["acorn-cli", "acorn-lib"]
resolver = "2"

[workspace.package]
version = "0.1.32"
license = "MIT"
authors = ["Jason Wohlgemuth <wohlgemuthjh@ornl.gov>"]
description = "Accessible Content Optimization for Research Needs - Multitool for maintaining sustainable research activity data"
documentation = "https://acorn.ornl.gov"
readme = "README.md"
repository = "https://code.ornl.gov/research-enablement/acorn"
keywords = ["research", "automation"]
exclude = [".vale", ".vscode"]

[workspace.lints.clippy]
# cargo = "warn"

[workspace.lints.rust]
missing-docs = "deny"
rust-2018-idioms = "warn"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken-intra-doc-links = "forbid"

[workspace.dependencies]
color-eyre = "0.6.3"
data-encoding = "2.9.0"
derive_more = { version = "2.0.1", features = ["display", "from_str"] }
dotenvy = "0.15.0"
duct = "1.0.0"
exitcode = "1.1.2"
glob = "0.3.1"
indicatif = "0.17.11"
lazy_static = "1.5.0"
owo-colors = "4.2.0"
rayon = "1.7.0"
rust-embed = "8.7.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_repr = "0.1"
serde_yml = "0.0.12"
tokio = { version = "1.45.0", features = ["full"] }
tracing = { version = "0.1.40" }
tracing-indicatif = "0.3.8"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uriparse = "0.6.4"

[workspace.metadata.cross.build]
default-target = "x86_64-unknown-linux-musl"
debug-assertions = true

[profile.release]
debug = true
codegen-units = 1
opt-level = "s"
overflow-checks = true
panic = "abort"
strip = true
lto = true
