[workspace]
members = ["acorn-cli", "acorn-lib"]
resolver = "2"

[workspace.package]
version = "0.1.15"
license-file = "LICENSE"
authors = ["Jason Wohlgemuth <wohlgemuthjh@ornl.gov>"]
description = "Accessible Content Optimization for Research Needs - Multitool for maintaining sustainable research activity data"
documentation = "https://acorn.ornl.gov"
readme = "README.md"
homepage = "https://acorn.ornl.gov"
repository = "https://code.ornl.gov/research-enablement/acorn"
keywords = ["research", "automation"]
exclude = [".vale", ".vscode"]

[workspace.lints.clippy]
# cargo = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
rust-2018-idioms = "warn"

[workspace.dependencies]
color-eyre = "0.6.3"
data-encoding = "2.7.0"
derive_more = { version = "2.0.1", features = ["display", "from_str"] }
exitcode = "1.1.2"
glob = "0.3.1"
indicatif = "0.17.11"
lazy_static = "1.5.0"
owo-colors = "4.2.0"
rayon = "1.7.0"
rust-embed = "8.6.0"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
serde_repr = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1.40" }
tracing-indicatif = "0.3.8"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uriparse = "0.6.4"

[workspace.metadata.cross.build]
default-target = "x86_64-unknown-linux-gnu"
debug-assertions = true
