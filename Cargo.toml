[workspace]
members = ["acorn-cli", "acorn-lib", "acorn-macros"]
resolver = "2"

[workspace.package]
version = "0.1.52"
license = "MIT"
authors = ["Jason Wohlgemuth <wohlgemuthjh@ornl.gov>"]
description = "Accessible Content Optimization for Research Needs - Multitool for maintaining sustainable research activity data"
documentation = "https://acorn.ornl.gov"
readme = "README.md"
repository = "https://code.ornl.gov/research-enablement/acorn"
keywords = ["research", "automation"]
exclude = [".vale", ".vscode"]

[workspace.lints.clippy]
alloc_instead_of_core = "warn"
# arithmetic_side_effects = "warn"
# expect_used = "warn"
# indexing_slicing = "warn"
panic = "warn"
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
# unwrap_used = "warn"

[workspace.lints.rust]
missing-docs = "deny"
rust-2018-idioms = "warn"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken-intra-doc-links = "forbid"

[workspace.dependencies]
async-trait = { version = "0.1.86", default-features = false }
axum = { version = "0.8.9", default-features = false }
chrono = { version = "0.4", features = ["serde", "std"], default-features = false }
color-eyre = { version = "0.6.5", default-features = false }
data-encoding = { version = "2.10.0", features = ["alloc"], default-features = false }
derive_more = { version = "2.1.1", features = [
  "display",
  "from_str",
], default-features = false }
dotenvy = { version = "0.15.0", default-features = false }
docx-rs = { version = "0.4.17", default-features = false }
duckdb = { version = "1.10502.0", default-features = false }
fancy-regex = { version = "0.17.0", default-features = false }
futures = { version = "0.3.32", features = ["alloc"], default-features = false }
glob = { version = "0.3.1", default-features = false }
insta = { version = "1.47.2", default-features = false }
itertools = { version = "0.14.0", default-features = false }
lazy_static = { version = "1.5.0", default-features = false }
nanoid = { version = "0.5.0", default-features = false }
owo-colors = { version = "4.3.0", features = ["alloc"], default-features = true }
rayon = { version = "1.12.0", default-features = false }
rmcp = { version = "1.5.0", default-features = false }
rust-embed = { version = "8.11.0", default-features = false }
rusqlite = { version = "0.39.0", default-features = false }
secrecy = { version = "0.10.3", default-features = false }
serde = { version = "1.0.225", features = ["derive"], default-features = false }
serde_json = { version = "1.0.149", default-features = false }
sophia = { version = "0.9.0", default-features = false }
strum = { version = "0.28.0", features = ["derive"], default-features = false }
serde_repr = { version = "0.1", default-features = false }
serde_yml = { version = "0.0.12", default-features = false }
tera = { version = "1.20.0", default-features = false }
tracing = { version = "0.1.40", default-features = false }
tracing-indicatif = { version = "0.3.14", default-features = false }
tracing-log = { version = "0.2.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = [
  "ansi",
  "env-filter",
], default-features = false }
tower = { version = "0.5.3", default-features = false }
triomphe = { version = "0.1.15", default-features = false }
uriparse = { version = "0.6.4", default-features = false }
validator = { version = "0.20.0", features = ["derive"], default-features = false }

[workspace.metadata.cross.build]
default-target = "x86_64-unknown-linux-musl"
debug-assertions = true

[profile.release]
codegen-units = 1
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = true
lto = true

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
