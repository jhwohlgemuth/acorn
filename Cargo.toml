[workspace]
members = ["crates/acorn-analysis", "crates/acorn-cli", "crates/acorn-cmd", "crates/acorn-core", "crates/acorn-diff", "crates/acorn-host", "crates/acorn-lib", "crates/acorn-macros", "crates/acorn-schema", "crates/acorn-server", "crates/acorn-service", "crates/acorn-tui", "crates/acorn-wasm", "tests/downstream-host", "xtask"]
resolver = "2"

[workspace.package]
version = "0.4.0"
rust-version = "1.96.0"
license = "MIT"
authors = ["Jason Wohlgemuth <wohlgemuthjh@ornl.gov>"]
description = "Accessible Content Optimization for Research Needs - Multitool for maintaining sustainable research activity data"
documentation = "https://acorn.ornl.gov"
readme = "README.md"
repository = "https://code.ornl.gov/research-enablement/acorn"
keywords = ["research", "automation"]
exclude = [".vale", ".vscode"]

[workspace.lints.clippy]
alloc_instead_of_core = "warn"
arithmetic_side_effects = "warn"
# cast_possible_truncation = "deny"
# cast_precision_loss = "deny"
# cast_possible_wrap = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
expect_used = "warn"
indexing_slicing = "warn"
join_absolute_paths = "warn"
match_same_arms = "warn"
option_env_unwrap = "warn"
panic = "warn"
panicking_unwrap = "warn"
serde_api_misuse = "warn"
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
transmute_ptr_to_ref = "deny"
transmute_undefined_repr = "deny"
uninit_vec = "warn"
unchecked_time_subtraction = "deny"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"
wildcard_imports = "warn"
wildcard_in_or_patterns = "warn"

[workspace.lints.rust]
missing-docs = "deny"
rust-2018-idioms = "warn"
unnecessary_transmutes = "deny"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken-intra-doc-links = "forbid"

[workspace.dependencies]
acorn-analysis = { version = "0.4.0", path = "crates/acorn-analysis", default-features = false }
acorn-core = { version = "0.4.0", path = "crates/acorn-core", default-features = false }
acorn-schema = { version = "0.4.0", path = "crates/acorn-schema", default-features = false }
acorn-server = { version = "0.4.0", path = "crates/acorn-server" }
acorn-service = { version = "0.4.0", path = "crates/acorn-service", default-features = false }
agent-client-protocol = { version = "=2.2.0", default-features = false }
anydoc = { version = "0.1.6", default-features = false }
infer = { version = "0.22.0", default-features = false }
pdf-inspector = { version = "0.1.7", default-features = false }
pomsky = { version = "0.12.0", default-features = false }
sevenz-rust2 = { version = "0.21.5", features = ["compress"], default-features = false }
async-trait = { version = "0.1.86", default-features = false }
axum = { version = "0.8.9", default-features = false }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"], default-features = false }
jiff = { version = "0.2", features = ["serde"], default-features = false }
color-eyre = { version = "0.6.5", default-features = false }
command-group = { version = "5.0.1", default-features = false }
data-encoding = { version = "2.10.0", features = ["alloc"], default-features = false }
derive_more = { version = "2.1.1", features = [
  "display",
  "from_str",
], default-features = false }
directories = { version = "6.0.0", default-features = false }
dotenvy = { version = "0.15.0", default-features = false }
dprint-core = "0.69.1"
dprint-plugin-json = "0.25.0"
duckdb = { version = "~1.10505.0", default-features = false }
fancy-regex = { version = "0.17.0", default-features = false }
futures = { version = "0.3.32", features = ["alloc"], default-features = false }
glob = { version = "0.3.1", default-features = false }
http = { version = "1.3.1", default-features = false }
httpdate = { version = "1.0.3", default-features = false }
indicatif = { version = "0.18.2", default-features = false }
jsonc-parser = { version = "0.33", features = ["serde", "serde_json", "cst"], default-features = false }
jsonschema = { version = "0.57.0", default-features = false }
insta = { version = "1.47.2", default-features = false }
itertools = { version = "0.14.0", features = ["use_alloc"], default-features = false }
lazy_static = { version = "1.5.0", default-features = false }
nanoid = { version = "0.5.0", default-features = false }
notify = { version = "8.2.0" }
notify-debouncer-mini = { version = "0.7.0" }
owo-colors = { version = "4.3.0", features = ["alloc"], default-features = true }
pretty_yaml = "0.6.0"
prost = { version = "=0.14.4", features = ["derive", "std"], default-features = false }
prost-types = { version = "=0.14.4", default-features = false }
protoc-bin-vendored = { version = "=3.2.0", default-features = false }
quick-xml = { version = "0.39.1", default-features = false }
rayon = { version = "1.12.0", default-features = false }
rmcp = { version = "1.5.0", default-features = false }
shell-words = { version = "1.1.0", default-features = false }
rust-embed = { version = "8.11.0", default-features = false }
rustls = { version = "0.23.36", features = ["ring"], default-features = false }
rusqlite = { version = "0.39.0", default-features = false }
secrecy = { version = "0.10.3", features = ["serde"], default-features = false }
veil = { version = "0.3.0" }
serde = { version = "1.0.225", features = ["derive"], default-features = false }
serde_json = { version = "1.0.149", default-features = false }
similar = { version = "3.1.0", features = ["text"], default-features = false }
eserde = { version = "0.1", features = ["derive", "json"], default-features = false }
sophia = { version = "0.9.0", default-features = false }
strum = { version = "0.28.0", features = ["derive"], default-features = false }
swhid = { version = "0.2.2", default-features = false }
tokio = { version = "1.48.0", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
tonic = { version = "=0.14.6", features = [
  "channel",
  "codegen",
  "router",
  "server",
  "tls-native-roots",
  "tls-ring",
], default-features = false }
tonic-prost = { version = "=0.14.6", default-features = false }
tonic-prost-build = { version = "=0.14.6", features = ["transport"], default-features = false }
serde_repr = { version = "0.1", default-features = false }
serde_norway = { version = "0.9.42", default-features = false }
rhai = { version = "1.22.0", default-features = false, features = ["serde"] }
validator = { version = "0.20.0", features = ["derive"], default-features = false }
tera = { version = "1.20.0", default-features = false }
tracing = { version = "0.1.40", default-features = false }
tracing-indicatif = { version = "0.3.14", default-features = false }
tracing-log = { version = "0.2.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = [
  "ansi",
  "env-filter",
], default-features = false }
tower = { version = "0.5.3", default-features = false }
triomphe = { version = "0.1.15", default-features = false }
fluent-uri = { version = "0.4", default-features = false }
arboard = { version = "3.6.1", default-features = false }

[workspace.metadata.cross.build]
default-target = "x86_64-unknown-linux-musl"
debug-assertions = true

[profile.release]
codegen-units = 1
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = true
lto = true

[profile.dev.package]
"*".opt-level = 2
acorn-lib.opt-level = 1
insta.opt-level = 3
similar.opt-level = 3

[profile.test.package]
"*".opt-level = 2
acorn-lib.opt-level = 1
insta.opt-level = 3
similar.opt-level = 3

[profile.coverage]
inherits = "test"
debug = 1
