variables:
  BINARY_NAME: acorn
  CHANGELOG: https://code.ornl.gov/research-enablement/acorn/-/blob/main/CHANGELOG.md
  USER: CI
  EMAIL: $GITLAB_USER_EMAIL
  CI_DEBUG_SERVICES: true
  IS_VERSION_TAGGED: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

stages:
  - prepare
  - test
  - build
  - release
  - docs

prepare-environment:
  stage: prepare
  image: ubuntu
  tags:
    - cpu
  inherit:
    variables: false
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  script:
    - echo "PKG_VERSION=$(awk -F ' = ' '$1 ~ /version/ { gsub(/["]/, "", $2); printf("%s",$2) }' Cargo.toml)" >> variables.env
    - echo "PKG_REGISTRY_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic" >> variables.env
    - echo "DEFAULT_TARGET=$(awk -F ' = ' '$1 ~ /default-target/ { gsub(/["]/, "", $2); printf("%s",$2) }' Cargo.toml | tr . _)" >> variables.env
    - echo "DEFAULT_WINDOWS_TARGET=$(awk -F ' *= *' '$1=="WINDOWS_TARGET"{ sub(/\r$/,"",$2); print $2; exit }' Makefile)" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env

test:
  stage: test
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - cpu
  inherit:
    variables: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ${BINARY_NAME}-cli/**/*
        - ${BINARY_NAME}-lib/**/*
        - Cargo.toml
  script:
    - make test-ci

test-python:
  stage: test
  image: ghcr.io/prefix-dev/pixi:latest
  tags:
    - cpu
  inherit:
    variables: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ${BINARY_NAME}-py/**/*
  script:
    - apt-get update && apt-get install -y build-essential curl
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env && cd ${BINARY_NAME}-py && pixi run test

build-release:
  stage: build
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - cpu
  inherit:
    variables: true
  needs:
    - job: test
  script:
    - make build
    - make build-win
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  artifacts:
    paths:
      - bin/

publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - cpu
  inherit:
    variables: true
  needs:
    - job: prepare-environment
      artifacts: true
    - job: build-release
  script:
    - echo "Publishing ${BINARY_NAME} v${PKG_VERSION}"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  release:
    tag_name: "v${PKG_VERSION}"
    description: "## ${BINARY_NAME} v${PKG_VERSION}\n> See [CHANGELOG](${CHANGELOG}) and [documentation](https://acorn.ornl.gov) for details"
    ref: "${CI_COMMIT_SHA}"
    assets:
      links:
        - name: "${BINARY_NAME} v${PKG_VERSION} (Linux)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}"
        - name: "${BINARY_NAME} v${PKG_VERSION} (Windows)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_WINDOWS_TARGET}/v${PKG_VERSION}/${BINARY_NAME}.exe"

upload-binaries:
  stage: release
  image: curlimages/curl:latest
  tags:
    - cpu
  inherit:
    variables: true
  needs:
    - job: prepare-environment
      artifacts: true
    - job: build-release
      artifacts: true
    - job: publish-release
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  script:
    - ls -la bin/
    - 'curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file bin/${BINARY_NAME}-v${PKG_VERSION} ${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}'

publish-crates:
  stage: release
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - cpu
  inherit:
    variables: true
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
  script:
    - cargo publish --token "${CARGO_REGISTRY_TOKEN}" --package "${BINARY_NAME}-lib"
    - cargo publish --token "${CARGO_REGISTRY_TOKEN}" --package "${BINARY_NAME}-cli"

publish-book:
  stage: docs
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - cpu
  inherit:
    variables: true
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
  script:
    - cargo install mdbook mdbook-mermaid mdbook-pikchr
    - git config --global user.name "${USER}"
    - git config --global user.email "${EMAIL}"
    - make publish-book
  allow_failure: true