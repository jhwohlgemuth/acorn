variables:
  BINARY_NAME: acorn
  GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  GIT_CLEAN_FLAGS: -ffdx
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/target
  CARGO_NET_RETRY: "3"
  CARGO_HTTP_TIMEOUT: "120"
  NIGHTLY_TOOLCHAIN: nightly-2026-08-01
  CHANGELOG: https://code.ornl.gov/research-enablement/acorn/-/blob/main/CHANGELOG.md
  USER: ACORN CI
  EMAIL: $GITLAB_USER_EMAIL
  HOMEBREW_TAP_REPO_URL: https://code.ornl.gov/research-enablement/homebrew-acorn.git
  HOMEBREW_TAP_FORMULA_PATH: Formula/acorn-cli.rb
  IS_VERSION_TAGGED: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

default:
  interruptible: true
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure
      - stuck_or_timeout_failure

stages:
  - prepare
  - test
  - performance
  - build
  - release
  - docs

prepare-environment:
  stage: prepare
  image: ubuntu@sha256:7b202b0e2e0028c6250f5fcf41d04df492d145a1654c6995a6553f0c1f6f1960
  tags:
    - cpu
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
        - Cargo.lock
        - crates/acorn-core/Cargo.toml
        - crates/acorn-schema/Cargo.toml
        - crates/acorn-lib/Cargo.toml
  script:
    - echo "PKG_VERSION=$(awk -F ' = ' '$1 ~ /^version/ { gsub(/["]/, "", $2); printf("%s",$2) }' Cargo.toml)" >> variables.env
    - echo "PKG_REGISTRY_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic" >> variables.env
    - echo "DEFAULT_TARGET=$(awk -F ' = ' '$1 ~ /default-target/ { gsub(/["]/, "", $2); printf("%s",$2) }' Cargo.toml | tr . _)" >> variables.env
    - echo "DEFAULT_WINDOWS_TARGET=$(awk -F ' *= *' '$1=="DEFAULT_WINDOWS_TARGET"{ sub(/\r$/,"",$2); print $2; exit }' Makefile)" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env

test:
  stage: test
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  resource_group: tests
  tags:
    - cpu
  hooks:
    pre_get_sources_script:
      - rm -f "${CI_PROJECT_DIR}/.git/index.lock" "${CI_PROJECT_DIR}/.git/shallow.lock"
  inherit:
    variables: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - make test-ci
    - make check-host
    - cargo package --no-verify --allow-dirty -p acorn-core -p acorn-schema

test-portability:
  stage: test
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - cpu
  hooks:
    pre_get_sources_script:
      - rm -f "${CI_PROJECT_DIR}/.git/index.lock" "${CI_PROJECT_DIR}/.git/shallow.lock"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - Makefile
        - crates/acorn-core/**/*
        - crates/acorn-lib/**/*
        - crates/acorn-schema/**/*
        - scripts/check-portable-dependencies.sh
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - make check-portable

test-python:
  stage: test
  image: ghcr.io/prefix-dev/pixi@sha256:e059bf6b10fca60158d8cfd81a150a81318f23a427212ac782210c46149af90b
  resource_group: tests
  tags:
    - cpu
  hooks:
    pre_get_sources_script:
      - rm -f "${CI_PROJECT_DIR}/.git/index.lock" "${CI_PROJECT_DIR}/.git/shallow.lock"
  inherit:
    variables: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - crates/${BINARY_NAME}-py/**/*
        - Cargo.toml
        - Cargo.lock
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - crates/${BINARY_NAME}-py/**/*
        - Cargo.toml
        - Cargo.lock
  script:
    - cd crates/${BINARY_NAME}-py && pixi run test

test-docs:
  stage: test
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - cpu
  hooks:
    pre_get_sources_script:
      - rm -f "${CI_PROJECT_DIR}/.git/index.lock" "${CI_PROJECT_DIR}/.git/shallow.lock"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - CommandLineHelp.md
        - Makefile
        - crates/acorn-cli/src/cli/**/*
        - docs/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - CommandLineHelp.md
        - Makefile
        - crates/acorn-cli/src/cli/**/*
        - docs/**/*
  script:
    - command -v mdbook >/dev/null && command -v mdbook-mermaid >/dev/null && command -v mdbook-pikchr >/dev/null || cargo install --locked mdbook@0.5.2 mdbook-mermaid@0.17.0 mdbook-pikchr@0.2.0
    - rustc --version
    - cargo --version
    - mdbook --version
    - make help
    - git diff --exit-code -- CommandLineHelp.md
    - make book

fuzz-smoke:
  stage: test
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - cpu
  timeout: 12 minutes
  hooks:
    pre_get_sources_script:
      - rm -f "${CI_PROJECT_DIR}/.git/index.lock" "${CI_PROJECT_DIR}/.git/shallow.lock"
  inherit:
    variables: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - crates/acorn-lib/**/*
        - fuzz/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - crates/acorn-lib/**/*
        - fuzz/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
  script:
    - rustup run "${NIGHTLY_TOOLCHAIN}" cargo --version >/dev/null 2>&1 || rustup toolchain install "${NIGHTLY_TOOLCHAIN}" --profile minimal
    - command -v cargo-fuzz >/dev/null || cargo install --locked cargo-fuzz@0.13.1
    - rustc --version
    - cargo --version
    - cargo "+${NIGHTLY_TOOLCHAIN}" --version
    - rm -rf fuzz/artifacts
    - timeout --foreground --kill-after=30 180 cargo "+${NIGHTLY_TOOLCHAIN}" fuzz run --fuzz-dir fuzz location_repository fuzz/corpus/location_repository -- -max_total_time=5 -rss_limit_mb=2048 -timeout=5 -print_final_stats=1
    - timeout --foreground --kill-after=30 180 cargo "+${NIGHTLY_TOOLCHAIN}" fuzz run --fuzz-dir fuzz research_activity fuzz/corpus/research_activity -- -max_total_time=5 -rss_limit_mb=2048 -timeout=5 -print_final_stats=1

benchmark:
  stage: performance
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - cpu
  inherit:
    variables: true
  allow_failure: true
  interruptible: false
  resource_group: benchmarks
  timeout: 30 minutes
  needs:
    - job: test
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - crates/acorn-lib/**/*
        - xtask/**/*
        - scripts/benchmarks/**/*
        - Cargo.toml
        - Cargo.lock
        - Makefile
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - mkdir -p "${CARGO_TARGET_DIR}/benchmark-results"
    - rustc --version
    - cargo --version
    - make bench-baseline
    - bash scripts/benchmarks/persist.sh
  after_script:
    - mkdir -p "${CARGO_TARGET_DIR}/benchmark-results"
    - echo "job_status=${CI_JOB_STATUS}" > "${CARGO_TARGET_DIR}/benchmark-results/job-status.txt"
    - rustc --version >> "${CARGO_TARGET_DIR}/benchmark-results/job-status.txt" 2>&1 || true
    - cargo --version >> "${CARGO_TARGET_DIR}/benchmark-results/job-status.txt" 2>&1 || true
  artifacts:
    name: "benchmarks-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    expose_as: "Benchmark report"
    paths:
      - target/benchmark-results/
    expire_in: 30 days
    when: always

build-release:
  stage: build
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - cpu
  inherit:
    variables: true
  timeout: 45 minutes
  needs:
    - job: test
  script:
    - cargo --version
    - rustc --version
    - make build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  artifacts:
    paths:
      - bin/

publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli@sha256:a1bc1b35decb0ceededbb22bb9a8c07eddc1279ab6e9342b32bc42e20333aa7a
  tags:
    - cpu
  inherit:
    variables: true
  interruptible: false
  resource_group: gitlab-releases
  retry: 0
  needs:
    - job: prepare-environment
      artifacts: true
    - job: build-release
  script:
    - echo "Publishing ${BINARY_NAME} v${PKG_VERSION}"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  release:
    tag_name: "v${PKG_VERSION}"
    description: "## ${BINARY_NAME} v${PKG_VERSION}\n> See [CHANGELOG](${CHANGELOG}) and [documentation](https://acorn.ornl.gov) for details"
    ref: "${CI_COMMIT_SHA}"
    assets:
      links:
        - name: "${BINARY_NAME} v${PKG_VERSION} (Linux)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}"
        - name: "${BINARY_NAME} v${PKG_VERSION} (Windows)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_WINDOWS_TARGET}/v${PKG_VERSION}/${BINARY_NAME}.exe"

upload-binaries:
  stage: release
  image: curlimages/curl@sha256:b375ea94488a70540f48df7a7029bcce50e650915816e6497774db9451b4f877
  tags:
    - cpu
  inherit:
    variables: true
  interruptible: false
  resource_group: gitlab-package-uploads
  retry: 0
  needs:
    - job: prepare-environment
      artifacts: true
    - job: build-release
      artifacts: true
    - job: publish-release
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  script:
    - ls -la bin/
    - sh scripts/upload-binaries.sh

publish-crates:
  stage: release
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - cpu
  inherit:
    variables: true
  interruptible: false
  resource_group: crates-io
  retry: 0
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
  script:
    - bash scripts/publish-crates.sh

publish-homebrew-formula:
  stage: release
  image: alpine@sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f
  tags:
    - cpu
  inherit:
    variables: true
  interruptible: false
  resource_group: homebrew-tap
  retry: 0
  needs:
    - job: publish-crates
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
  before_script:
    - apk add --no-cache bash curl git
  script:
    - test -n "${HOMEBREW_TAP_REPO_URL:-}" || (echo "HOMEBREW_TAP_REPO_URL is required" && exit 1)
    - TAP_ACCESS_TOKEN="${HOMEBREW_TAP_ACCESS_TOKEN:-${ACCESS_TOKEN:-}}"
    - test -n "${TAP_ACCESS_TOKEN}" || (echo "HOMEBREW_TAP_ACCESS_TOKEN is required" && exit 1)
    - VERSION="${CI_COMMIT_TAG#v}"
    - TAP_BRANCH="${HOMEBREW_TAP_BRANCH:-main}"
    - git clone --depth 1 --branch "${TAP_BRANCH}" "${HOMEBREW_TAP_REPO_URL}" tap
    - ./scripts/homebrew/generate-formula.sh "${VERSION}" "tap/${HOMEBREW_TAP_FORMULA_PATH}"
    - cd tap
    - if ! git status --porcelain | grep -q .; then echo "No Homebrew formula changes detected"; exit 0; fi
    - git config user.name "${USER}"
    - git config user.email "${EMAIL}"
    - git add "${HOMEBREW_TAP_FORMULA_PATH}"
    - 'git commit -m "chore(homebrew): update acorn-cli ${CI_COMMIT_TAG}"'
    - 'git push "https://oauth2:${TAP_ACCESS_TOKEN}@${HOMEBREW_TAP_REPO_URL#https://}" "HEAD:${TAP_BRANCH}"'

publish-book:
  stage: docs
  image: savannah.ornl.gov/research-enablement/acorn/rust:latest
  tags:
    - cpu
  inherit:
    variables: true
  interruptible: false
  resource_group: documentation-site
  retry: 0
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - command -v mdbook >/dev/null && command -v mdbook-mermaid >/dev/null && command -v mdbook-pikchr >/dev/null || cargo install --locked mdbook@0.5.2 mdbook-mermaid@0.17.0 mdbook-pikchr@0.2.0
    - mdbook --version
    - git config --global user.name "${USER}"
    - git config --global user.email "${EMAIL}"
    - make publish-book
  allow_failure: true
