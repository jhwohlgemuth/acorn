default:
  tags:
    - cpu
  image: rust
  before_script:
    - rustup component add rustfmt
    - rustup component add clippy
    - rustup target add x86_64-unknown-linux-gnu
    - rustup target add x86_64-unknown-linux-musl

variables:
  USER: CI
  EMAIL: $GITLAB_USER_EMAIL

stages:
  - prepare
  - test
  - build
  - docs
  - release

prepare-environment:
  stage: prepare
  image: ubuntu
  inherit:
    default: false
    variables: false
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "======== PREPARE JOB ========"
    - echo "PKG_VERSION=$(awk -F ' = ' '$1 ~ /version/ { gsub(/["]/, "", $2); printf("%s",$2) }' Cargo.toml)" >> variables.env
    - echo "PKG_REGISTRY_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic" >> variables.env
    - echo $PKG_VERSION
  artifacts:
    reports:
      dotenv: variables.env

test:
  stage: test
  image: rust
  inherit:
    default: true
    variables: true
  rules:
  - if: $CI_COMMIT_TAG
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    changes:
      - acorn-cli/**/*
      - acorn-lib/**/*
      - Cargo.toml
  script: make test-ci

build-release:
  stage: build
  image: rust
  inherit:
    default: true
    variables: true
  needs:
    - job: test
  script:
    - make build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  artifacts:
    paths:
      - bin/

publish-docs:
  stage: docs
  image: rust
  inherit:
    default: false
    variables: true
  needs:
    - job: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - acorn-cli/**/*
        - acorn-lib/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - make doc
    - git config --global user.name "${USER}"
    - git config --global user.email "${EMAIL}"
    - git clone https://user:${ACCESS_TOKEN}@code-int.ornl.gov/sites/acorn.git site
    - ls
    - ls site
    - rm -rf ./site/html
    - mv target/doc/ ./site/html
    - echo '<meta http-equiv="refresh" content="0; url=acorn_lib/index.html">' > ./site/html/index.html
    - cd site
    - git add html
    - git commit -m "Publish changes"
    - git push

publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  inherit:
    default: false
    variables: false
  needs:
    - job: prepare-environment
      artifacts: true
    - job: build-release
  script:
    - echo "======== RELEASE JOB ========"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  release:
    tag_name: "v$PKG_VERSION"
    description: "ACORN CLI v$PKG_VERSION"
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: "v$PKG_VERSION"
          url: "${PKG_REGISTRY_URL}/x86_64-unknown-linux-gnu/v${PKG_VERSION}/acorn"

upload-binaries:
  stage: release
  image: curlimages/curl:latest
  inherit:
    default: false
    variables: false
  needs:
    - job: prepare-environment
      artifacts: true
    - job: build-release
      artifacts: true
    - job: publish-release
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  script:
    - echo "======== UPLOAD JOB ========"
    - ls -la bin/
    - 'curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file bin/acorn-v${PKG_VERSION} ${PKG_REGISTRY_URL}/x86_64-unknown-linux-gnu/v${PKG_VERSION}/acorn'
