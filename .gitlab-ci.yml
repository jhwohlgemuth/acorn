include:
  - local: /templates/gitlab/reporting.gitlab-ci.yml

variables:
  BINARY_NAME: acorn
  BUF_VERSION: "1.73.0"
  GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_JOB_ID/$CI_PROJECT_PATH
  GIT_CLEAN_FLAGS: -ffdx
  CARGO_TARGET_DIR: $CI_PROJECT_DIR/target
  XDG_CACHE_HOME: "$CI_PROJECT_DIR/.cache"
  CARGO_NET_RETRY: "3"
  CARGO_HTTP_TIMEOUT: "120"
  NIGHTLY_TOOLCHAIN: nightly-2026-08-01
  CHANGELOG: https://code.ornl.gov/research-enablement/acorn/-/blob/main/CHANGELOG.md
  HOMEBREW_TAP_REPO_URL: https://code.ornl.gov/research-enablement/homebrew-acorn.git
  HOMEBREW_TAP_FORMULA_PATH: Formula/acorn-cli.rb
  IS_VERSION_TAGGED: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CHECK_MODELPACK_DRIFT == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

default:
  interruptible: true
  retry:
    max: 2
    when:
      - api_failure
      - runner_system_failure
      - stuck_or_timeout_failure

stages:
  - prepare
  - test
  - extended-test
  - performance
  - build
  - release
  - docs

.publish:
  interruptible: false
  retry: 0

.rust-arm64:
  image: ghcr.io/jhwohlgemuth/acorn:rust-latest
  tags:
    - arm64

.rust-test:
  extends: .rust-arm64
  resource_group: tests
  hooks:
    pre_get_sources_script:
      - rm -f "${CI_PROJECT_DIR}/.git/index.lock" "${CI_PROJECT_DIR}/.git/shallow.lock"

modelpack-drift:
  extends: .rust-arm64
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CHECK_MODELPACK_DRIFT == "true"
  script:
    - sh scripts/check-modelpack-drift.sh

modelkit-upstream:
  stage: test
  image: golang@sha256:564e366a28ad1d70f460a2b97d1d299a562f08707eb0ecb24b659e5bd6c108e1
  tags:
    - amd64
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CHECK_MODELPACK_DRIFT == "true"
  script:
    - sh scripts/check-modelpack-drift.sh upstream-test

prepare-environment:
  stage: prepare
  image: ubuntu@sha256:7b202b0e2e0028c6250f5fcf41d04df492d145a1654c6995a6553f0c1f6f1960
  tags:
    - amd64
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - Dockerfile.rust
        - Makefile
        - crates/acorn-analysis/Cargo.toml
        - crates/acorn-cli/Cargo.toml
        - crates/acorn-cmd/Cargo.toml
        - crates/acorn-core/Cargo.toml
        - crates/acorn-diff/Cargo.toml
        - crates/acorn-host/Cargo.toml
        - crates/acorn-lib/Cargo.toml
        - crates/acorn-macros/Cargo.toml
        - crates/acorn-schema/Cargo.toml
        - crates/acorn-server/Cargo.toml
        - crates/acorn-service/Cargo.toml
        - crates/acorn-tui/Cargo.toml
        - crates/acorn-wasm/Cargo.toml
        - packaging/linux/**/*
        - scripts/install-appimage-tools.sh
        - scripts/install-zigbuild.sh
        - scripts/package-linux.sh
        - scripts/publish-crates.sh
        - scripts/upload-binaries.sh
        - xtask/**/*
  script:
    - echo "PKG_VERSION=$(awk -F ' = ' '$1 ~ /^version/ { gsub(/["]/, "", $2); printf("%s",$2) }' Cargo.toml)" >> variables.env
    - echo "PKG_REGISTRY_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic" >> variables.env
    - echo "DEFAULT_ARM64_TARGET=$(awk -F ' *= *' '$1=="DEFAULT_ARM64_TARGET"{ sub(/\r$/,"",$2); print $2; exit }' Makefile)" >> variables.env
    - echo "DEFAULT_TARGET=$(awk -F ' = ' '$1 ~ /default-target/ { gsub(/["]/, "", $2); printf("%s",$2) }' Cargo.toml | tr . _)" >> variables.env
    - echo "DEFAULT_WINDOWS_TARGET=$(awk -F ' *= *' '$1=="DEFAULT_WINDOWS_TARGET"{ sub(/\r$/,"",$2); print $2; exit }' Makefile)" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env

test:
  extends: .rust-test
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - command -v buf >/dev/null || (curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-$(uname -m)" -o /usr/local/bin/buf && chmod +x /usr/local/bin/buf)
    - "cargo-shear --version 2>/dev/null | grep -Fxq 'Version: 1.14.0' || cargo install --force --locked cargo-shear@1.14.0"
    - make check-dependencies
    - make test-ci
    - make check-host
    - bash scripts/publish-crates.sh --check
    - cargo package --workspace --exclude acorn-downstream-host-fixture --exclude xtask --no-verify --allow-dirty

test-portability:
  extends: .rust-test
  stage: extended-test
  allow_failure: true
  when: manual
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_EXTENDED_TESTS == "true"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - Makefile
        - crates/acorn-core/**/*
        - crates/acorn-analysis/**/*
        - crates/acorn-cmd/**/*
        - crates/acorn-diff/**/*
        - crates/acorn-host/**/*
        - crates/acorn-lib/**/*
        - crates/acorn-schema/**/*
        - crates/acorn-service/**/*
        - crates/acorn-wasm/**/*
        - scripts/check-portable-dependencies.sh
        - tests/downstream-host/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - command -v wasm-pack >/dev/null || cargo install --locked wasm-pack@0.15.0
    - make check-portable

test-docs:
  extends: .rust-test
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - CommandLineHelp.md
        - Makefile
        - crates/acorn-cli/src/cli/**/*
        - docs/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - CommandLineHelp.md
        - Makefile
        - crates/acorn-cli/src/cli/**/*
        - docs/**/*
  script:
    - command -v mdbook >/dev/null && command -v mdbook-mermaid >/dev/null && command -v mdbook-pikchr >/dev/null || cargo install --locked mdbook@0.5.2 mdbook-mermaid@0.17.0 mdbook-pikchr@0.2.0
    - rustc --version
    - cargo --version
    - mdbook --version
    - make help
    - git diff --exit-code -- CommandLineHelp.md
    - make book

fuzz-smoke:
  extends: .rust-test
  stage: extended-test
  allow_failure: true
  when: manual
  timeout: 12 minutes
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_EXTENDED_TESTS == "true"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - crates/acorn-lib/**/*
        - fuzz/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - crates/acorn-lib/**/*
        - fuzz/**/*
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
  script:
    - rustup run "${NIGHTLY_TOOLCHAIN}" cargo --version >/dev/null 2>&1 || rustup toolchain install "${NIGHTLY_TOOLCHAIN}" --profile minimal
    - command -v cargo-fuzz >/dev/null || cargo install --locked cargo-fuzz@0.13.1
    - rustc --version
    - cargo --version
    - cargo "+${NIGHTLY_TOOLCHAIN}" --version
    - rm -rf fuzz/artifacts
    - timeout --foreground --kill-after=30 180 cargo "+${NIGHTLY_TOOLCHAIN}" fuzz run --fuzz-dir fuzz location_repository fuzz/corpus/location_repository -- -max_total_time=5 -rss_limit_mb=2048 -timeout=5 -print_final_stats=1
    - timeout --foreground --kill-after=30 180 cargo "+${NIGHTLY_TOOLCHAIN}" fuzz run --fuzz-dir fuzz research_activity fuzz/corpus/research_activity -- -max_total_time=5 -rss_limit_mb=2048 -timeout=5 -print_final_stats=1

benchmark:
  extends: .rust-arm64
  stage: performance
  allow_failure: true
  interruptible: false
  resource_group: benchmarks
  timeout: 30 minutes
  needs:
    - job: test
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - crates/acorn-lib/**/*
        - xtask/**/*
        - scripts/benchmarks/**/*
        - Cargo.toml
        - Cargo.lock
        - Makefile
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - mkdir -p "${CARGO_TARGET_DIR}/benchmark-results"
    - rustc --version
    - cargo --version
    - make bench-baseline
    - bash scripts/benchmarks/persist.sh
  after_script:
    - mkdir -p "${CARGO_TARGET_DIR}/benchmark-results"
    - echo "job_status=${CI_JOB_STATUS}" > "${CARGO_TARGET_DIR}/benchmark-results/job-status.txt"
    - rustc --version >> "${CARGO_TARGET_DIR}/benchmark-results/job-status.txt" 2>&1 || true
    - cargo --version >> "${CARGO_TARGET_DIR}/benchmark-results/job-status.txt" 2>&1 || true
  artifacts:
    name: "benchmarks-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    expose_as: "Benchmark report"
    paths:
      - target/benchmark-results/
    expire_in: 30 days
    when: always

build-release:
  extends: .rust-arm64
  stage: build
  timeout: 45 minutes
  needs:
    - job: test
  script:
    - command -v appstreamcli >/dev/null && command -v file >/dev/null && command -v xz >/dev/null || (apt-get update && apt-get install --no-install-recommends --yes appstream file xz-utils)
    - command -v cargo-zigbuild >/dev/null && command -v zig >/dev/null || sh scripts/install-zigbuild.sh "${XDG_CACHE_HOME}/zigbuild"
    - export PATH="${XDG_CACHE_HOME}/zigbuild/bin:${PATH}"
    - cargo --version
    - cargo deb --version 2>/dev/null | grep -Eq 'cargo-deb 3\.8\.0$' || cargo install --locked --force cargo-deb --version 3.8.0
    - sh scripts/install-appimage-tools.sh "${XDG_CACHE_HOME}/appimage"
    - export APPIMAGE_RUNTIME_DIR="${XDG_CACHE_HOME}/appimage/lib/appimage"
    - export PATH="${XDG_CACHE_HOME}/appimage/bin:${PATH}"
    - cargo-zigbuild --version
    - cargo-deb --version
    - rustc --version
    - zig version
    - MUSL_BUILD="cargo zigbuild" make build linux-packages
    - mkdir -p target/linux-package-checksums
    - cp bin/*.AppImage.sha256 bin/*.deb.sha256 target/linux-package-checksums/
    - MUSL_BUILD="cargo zigbuild" make linux-packages
    - for checksum in target/linux-package-checksums/*; do cmp "$checksum" "bin/$(basename "$checksum")"; done
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - Dockerfile.rust
        - Makefile
        - crates/acorn-cli/Cargo.toml
        - crates/acorn-lib/Cargo.toml
        - packaging/linux/**/*
        - scripts/install-appimage-tools.sh
        - scripts/install-zigbuild.sh
        - scripts/package-linux.sh
  artifacts:
    paths:
      - bin/

validate-linux-amd64:
  stage: build
  image: ghcr.io/jhwohlgemuth/acorn:rust-latest
  tags:
    - amd64
  needs:
    - job: prepare-environment
      artifacts: true
    - job: build-release
      artifacts: true
  script:
    - appimage="$(pwd)/bin/acorn-v${PKG_VERSION}-x86_64.AppImage"
    - package="$(pwd)/bin/acorn_${PKG_VERSION}-1_amd64.deb"
    - test "$(dpkg-deb --field "$package" Package)" = acorn-cli
    - test "$(dpkg-deb --field "$package" Architecture)" = amd64
    - test "$(dpkg-deb --field "$package" Version)" = "${PKG_VERSION}-1"
    - test "$(dpkg-deb --field "$package" Conflicts)" = node-acorn
    - test "$(dpkg-deb --field "$package" Depends)" = ca-certificates
    - test "$(dpkg-deb --field "$package" Replaces)" = node-acorn
    - (cd bin && sha256sum -c "$(basename "$appimage").sha256")
    - (cd bin && sha256sum -c "$(basename "$package").sha256")
    - mkdir -p target/appimage-x86_64
    - dpkg-deb --contents "$package" > target/appimage-x86_64/deb-contents.txt
    - grep -Eq ' ./usr/bin/acorn$' target/appimage-x86_64/deb-contents.txt
    - chmod 755 "$appimage"
    - APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
    - APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --help >/dev/null
    - (cd target/appimage-x86_64 && "$appimage" --appimage-extract >/dev/null)
    - test -x target/appimage-x86_64/squashfs-root/AppRun
    - test -x target/appimage-x86_64/squashfs-root/usr/bin/acorn
    - test -f target/appimage-x86_64/squashfs-root/gov.ornl.acorn.desktop
    - test -f target/appimage-x86_64/squashfs-root/gov.ornl.acorn.svg
    - test -f target/appimage-x86_64/squashfs-root/usr/share/metainfo/gov.ornl.acorn.appdata.xml
    - DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --yes "$package"
    - acorn --version
    - acorn --help >/dev/null
    - dpkg -r acorn-cli
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - Dockerfile.rust
        - Makefile
        - crates/acorn-cli/Cargo.toml
        - packaging/linux/**/*
        - scripts/install-appimage-tools.sh
        - scripts/package-linux.sh

validate-linux-arm64:
  extends: .rust-arm64
  stage: build
  needs:
    - job: prepare-environment
      artifacts: true
    - job: build-release
      artifacts: true
  script:
    - appimage="$(pwd)/bin/acorn-v${PKG_VERSION}-aarch64.AppImage"
    - package="$(pwd)/bin/acorn_${PKG_VERSION}-1_arm64.deb"
    - test "$(dpkg-deb --field "$package" Package)" = acorn-cli
    - test "$(dpkg-deb --field "$package" Architecture)" = arm64
    - test "$(dpkg-deb --field "$package" Version)" = "${PKG_VERSION}-1"
    - test "$(dpkg-deb --field "$package" Conflicts)" = node-acorn
    - test "$(dpkg-deb --field "$package" Depends)" = ca-certificates
    - test "$(dpkg-deb --field "$package" Replaces)" = node-acorn
    - (cd bin && sha256sum -c "$(basename "$appimage").sha256")
    - (cd bin && sha256sum -c "$(basename "$package").sha256")
    - mkdir -p target/appimage-aarch64
    - dpkg-deb --contents "$package" > target/appimage-aarch64/deb-contents.txt
    - grep -Eq ' ./usr/bin/acorn$' target/appimage-aarch64/deb-contents.txt
    - chmod 755 "$appimage"
    - APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
    - APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --help >/dev/null
    - (cd target/appimage-aarch64 && "$appimage" --appimage-extract >/dev/null)
    - test -x target/appimage-aarch64/squashfs-root/AppRun
    - test -x target/appimage-aarch64/squashfs-root/usr/bin/acorn
    - test -f target/appimage-aarch64/squashfs-root/gov.ornl.acorn.desktop
    - test -f target/appimage-aarch64/squashfs-root/gov.ornl.acorn.svg
    - test -f target/appimage-aarch64/squashfs-root/usr/share/metainfo/gov.ornl.acorn.appdata.xml
    - DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --yes "$package"
    - acorn --version
    - acorn --help >/dev/null
    - dpkg -r acorn-cli
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - Dockerfile.rust
        - Makefile
        - crates/acorn-cli/Cargo.toml
        - packaging/linux/**/*
        - scripts/install-appimage-tools.sh
        - scripts/package-linux.sh

validate-mcpb:
  stage: build
  image: ghcr.io/jhwohlgemuth/acorn:rust-latest
  tags:
    - amd64
  needs:
    - job: prepare-environment
      artifacts: true
    - job: build-release
      artifacts: true
  script:
    - make release-checksums
    - make mcpb
    - npx --yes @anthropic-ai/mcpb@2.1.2 unpack "bin/acorn-v${PKG_VERSION}-${DEFAULT_TARGET}.mcpb" target/mcpb-linux
    - npx --yes @anthropic-ai/mcpb@2.1.2 validate target/mcpb-linux/manifest.json
    - npx --yes @anthropic-ai/mcpb@2.1.2 unpack "bin/acorn-v${PKG_VERSION}-${DEFAULT_WINDOWS_TARGET}.mcpb" target/mcpb-windows
    - npx --yes @anthropic-ai/mcpb@2.1.2 validate target/mcpb-windows/manifest.json
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .gitlab-ci.yml
        - Cargo.lock
        - Cargo.toml
        - Dockerfile.rust
        - Makefile
        - crates/acorn-cli/Cargo.toml
        - crates/acorn-lib/Cargo.toml
        - scripts/install-zigbuild.sh
  artifacts:
    paths:
      - bin/

publish-release:
  extends: .publish
  stage: release
  image: registry.gitlab.com/gitlab-org/cli@sha256:a1bc1b35decb0ceededbb22bb9a8c07eddc1279ab6e9342b32bc42e20333aa7a
  tags:
    - amd64
  resource_group: gitlab-releases
  needs:
    - job: prepare-environment
      artifacts: true
    - job: validate-linux-amd64
    - job: validate-linux-arm64
    - job: validate-mcpb
  script:
    - echo "Publishing ${BINARY_NAME} v${PKG_VERSION}"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  release:
    tag_name: "v${PKG_VERSION}"
    description: "## ${BINARY_NAME} v${PKG_VERSION}\n> See [CHANGELOG](${CHANGELOG}) and [documentation](https://acorn.ornl.gov) for details"
    ref: "${CI_COMMIT_SHA}"
    assets:
      links:
        - name: "${BINARY_NAME} v${PKG_VERSION} (Linux)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}"
        - name: "${BINARY_NAME} v${PKG_VERSION} (Windows)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_WINDOWS_TARGET}/v${PKG_VERSION}/${BINARY_NAME}.exe"
        - name: "${BINARY_NAME} AppImage v${PKG_VERSION} (ARM64)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_ARM64_TARGET}/v${PKG_VERSION}/${BINARY_NAME}-v${PKG_VERSION}-aarch64.AppImage"
        - name: "${BINARY_NAME} AppImage v${PKG_VERSION} (ARM64 SHA-256)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_ARM64_TARGET}/v${PKG_VERSION}/${BINARY_NAME}-v${PKG_VERSION}-aarch64.AppImage.sha256"
        - name: "${BINARY_NAME} AppImage v${PKG_VERSION} (x86_64)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}-v${PKG_VERSION}-x86_64.AppImage"
        - name: "${BINARY_NAME} AppImage v${PKG_VERSION} (x86_64 SHA-256)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}-v${PKG_VERSION}-x86_64.AppImage.sha256"
        - name: "${BINARY_NAME} Debian v${PKG_VERSION} (amd64)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}_${PKG_VERSION}-1_amd64.deb"
        - name: "${BINARY_NAME} Debian v${PKG_VERSION} (amd64 SHA-256)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}_${PKG_VERSION}-1_amd64.deb.sha256"
        - name: "${BINARY_NAME} Debian v${PKG_VERSION} (ARM64)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_ARM64_TARGET}/v${PKG_VERSION}/${BINARY_NAME}_${PKG_VERSION}-1_arm64.deb"
        - name: "${BINARY_NAME} Debian v${PKG_VERSION} (ARM64 SHA-256)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_ARM64_TARGET}/v${PKG_VERSION}/${BINARY_NAME}_${PKG_VERSION}-1_arm64.deb.sha256"
        - name: "${BINARY_NAME} MCPB v${PKG_VERSION} (Linux)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}.mcpb"
        - name: "${BINARY_NAME} MCPB v${PKG_VERSION} (Linux SHA-256)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_TARGET}/v${PKG_VERSION}/${BINARY_NAME}.mcpb.sha256"
        - name: "${BINARY_NAME} MCPB v${PKG_VERSION} (Windows)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_WINDOWS_TARGET}/v${PKG_VERSION}/${BINARY_NAME}.mcpb"
        - name: "${BINARY_NAME} MCPB v${PKG_VERSION} (Windows SHA-256)"
          url: "${PKG_REGISTRY_URL}/${DEFAULT_WINDOWS_TARGET}/v${PKG_VERSION}/${BINARY_NAME}.mcpb.sha256"

upload-binaries:
  extends: .publish
  stage: release
  image: curlimages/curl@sha256:b375ea94488a70540f48df7a7029bcce50e650915816e6497774db9451b4f877
  tags:
    - amd64
  resource_group: gitlab-package-uploads
  needs:
    - job: prepare-environment
      artifacts: true
    - job: validate-mcpb
      artifacts: true
    - job: publish-release
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - Cargo.toml
  script:
    - ls -la bin/
    - sh scripts/upload-binaries.sh

publish-crates:
  extends:
    - .publish
    - .rust-arm64
  stage: release
  resource_group: crates-io
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
  script:
    - bash scripts/publish-crates.sh

publish-homebrew-formula:
  extends: .publish
  stage: release
  image: alpine@sha256:79ff19e9084a00eece421b2523fb93e22d730e2c0e525905de047e848e56d95f
  tags:
    - amd64
  resource_group: homebrew-tap
  variables:
    HOMEBREW_TAP_GIT_EMAIL: $GITLAB_USER_EMAIL
    HOMEBREW_TAP_GIT_USER: ACORN CI
  needs:
    - job: publish-crates
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
  before_script:
    - apk add --no-cache bash curl git
  script:
    - test -n "${HOMEBREW_TAP_REPO_URL:-}" || (echo "HOMEBREW_TAP_REPO_URL is required" && exit 1)
    - TAP_ACCESS_TOKEN="${HOMEBREW_TAP_ACCESS_TOKEN:-${ACCESS_TOKEN:-}}"
    - test -n "${TAP_ACCESS_TOKEN}" || (echo "HOMEBREW_TAP_ACCESS_TOKEN is required" && exit 1)
    - VERSION="${CI_COMMIT_TAG#v}"
    - TAP_BRANCH="${HOMEBREW_TAP_BRANCH:-main}"
    - git clone --depth 1 --branch "${TAP_BRANCH}" "${HOMEBREW_TAP_REPO_URL}" tap
    - bash scripts/homebrew/generate-formula.sh "${VERSION}" "tap/${HOMEBREW_TAP_FORMULA_PATH}"
    - cd tap
    - if ! git status --porcelain | grep -q .; then echo "No Homebrew formula changes detected"; exit 0; fi
    - git config user.name "${HOMEBREW_TAP_GIT_USER}"
    - git config user.email "${HOMEBREW_TAP_GIT_EMAIL}"
    - git add "${HOMEBREW_TAP_FORMULA_PATH}"
    - 'git commit -m "chore(homebrew): update acorn-cli ${CI_COMMIT_TAG}"'
    - 'git push "https://oauth2:${TAP_ACCESS_TOKEN}@${HOMEBREW_TAP_REPO_URL#https://}" "HEAD:${TAP_BRANCH}"'

publish-book:
  extends:
    - .publish
    - .rust-arm64
  stage: docs
  resource_group: documentation-site
  variables:
    GIT_USER_EMAIL: $GITLAB_USER_EMAIL
    GIT_USER_NAME: ACORN CI
  rules:
    - if: $CI_COMMIT_TAG != null && $IS_VERSION_TAGGED
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - command -v mdbook >/dev/null && command -v mdbook-mermaid >/dev/null && command -v mdbook-pikchr >/dev/null || cargo install --locked mdbook@0.5.2 mdbook-mermaid@0.17.0 mdbook-pikchr@0.2.0
    - mdbook --version
    - git config --global user.name "${GIT_USER_NAME}"
    - git config --global user.email "${GIT_USER_EMAIL}"
    - make publish-book
  allow_failure: true
