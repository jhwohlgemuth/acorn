stages:
  - test

windows-shell-smoke:
  stage: test
  tags:
    - windows-x86_64
  timeout: 10 minutes
  script:
    - Write-Output "CI_RUNNER_ID=$env:CI_RUNNER_ID"
    - Write-Output "CI_RUNNER_DESCRIPTION=$env:CI_RUNNER_DESCRIPTION"
    - Write-Output "CI_RUNNER_TAGS=$env:CI_RUNNER_TAGS"
    - Write-Output "OS=$([System.Environment]::OSVersion.VersionString)"
    - Write-Output "ARCH=$env:PROCESSOR_ARCHITECTURE"
    - Write-Output "64BIT=$([Environment]::Is64BitOperatingSystem)"
    - Write-Output "PS=$($PSVersionTable.PSVersion)"
    - Write-Output "EDITION=$($PSVersionTable.PSEdition)"
    - Write-Output "GIT=$((Get-Command git).Source)"
