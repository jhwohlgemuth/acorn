[package]
name = "acorn-daemon"
version.workspace = true
edition = "2021"
exclude.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Persistent host process for ACORN APIs and configured jobs"
documentation.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "acornd"
path = "src/main.rs"

[dependencies]
acorn-cmd = { workspace = true }
acorn-core = { workspace = true, features = ["std"] }
acorn-host = { workspace = true, features = ["fs"] }
acorn-lib = { workspace = true, features = ["analysis"] }
acorn-schema = { workspace = true, features = ["std"] }
acorn-server = { workspace = true }
acorn-service = { workspace = true, features = ["std"] }
acorn-store = { workspace = true }
clap = { version = "4.4.2", features = ["derive"] }
command-group = { workspace = true }
directories = { workspace = true }
notify = { workspace = true }
schemars = { version = "1.0.4", features = ["derive"], default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[dev-dependencies]
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false }
rusqlite = { workspace = true, features = ["bundled"] }
tempfile = "3"

[lints]
workspace = true
