[package]
name = "acorn-tui"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "ACORN terminal user interface (TUI)"
authors.workspace = true
documentation.workspace = true
keywords.workspace = true
repository.workspace = true

[[bin]]
name = "acorn-tui"
path = "src/main.rs"

[dependencies]
acorn-lib = { version = "0.1.59", path = "../acorn-lib", features = ["doctor"] }
color-eyre = { workspace = true }
crossterm = "0.28"
jiff = { workspace = true, features = ["std"] }
ratatui = { version = "0.30", features = ["crossterm"] }
reqwest = { version = "0.13.2", features = ["blocking", "rustls"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }

[lints.rust]
unsafe_code = "allow"
missing_docs = "allow"
