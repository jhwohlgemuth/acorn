[package]
edition = "2021"
name = "acorn-diff"
version.workspace = true
readme = "README.md"
description = "Portable unified and JSON Patch diff primitives for ACORN"
categories = ["algorithms", "data-structures", "development-tools", "no-std"]
authors.workspace = true
documentation.workspace = true
keywords = ["diff", "json-patch", "no-std", "rfc6902", "unified-diff"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }

[dev-dependencies]
json-patch = "4.2.0"
proptest = "1.9.0"

[features]
default = ["std"]
alloc = ["serde/alloc", "serde_json/alloc"]
std = ["alloc", "serde/std", "serde_json/std", "similar/std"]

[lints]
workspace = true
