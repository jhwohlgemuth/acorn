[package]
edition = "2021"
name = "acorn-wasm"
version.workspace = true
description = "JavaScript bindings for ACORN's portable validation and analysis APIs"
authors.workspace = true
documentation.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acorn-lib = { version = "0.3.0", path = "../acorn-lib", default-features = false, features = ["analyzer"] }
acorn-schema = { version = "0.3.0", path = "../acorn-schema", default-features = false, features = ["wasm"] }
eserde = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json.workspace = true
wasm-bindgen = "0.2.128"

[dev-dependencies]
wasm-bindgen-test = "0.3.78"

[lints]
workspace = true
