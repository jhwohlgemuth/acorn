[package]
name = "acorn-macros"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
description = "Procedural macros for ACORN"
documentation.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
proc-macro-crate = "3.5"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
trybuild = "1.0"

[package.metadata.cargo-shear]
ignored-paths = ["tests/ui/*.rs"]
