[package]
edition = "2021"
name = "acorn-cli"
readme = "../../README.md"
description = "ACORN command line interface"
repository = "https://code.ornl.gov/research-enablement/acorn"
categories = ["command-line-interface", "science"]
authors.workspace = true
documentation.workspace = true
keywords.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "acorn"
path = "src/main.rs"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
acorn-cmd = { version = "0.2.0", path = "../acorn-cmd" }
acorn-core = { version = "0.2.0", path = "../acorn-core" }
acorn-host = { version = "0.2.0", path = "../acorn-host", default-features = false, features = ["fs", "terminal"] }
acorn-lib = { version = "0.2.0", path = "../acorn-lib", features = ["agentic", "doctor", "needle", "powerpoint", "swhid-compute"] }
acorn-schema = { version = "0.2.0", path = "../acorn-schema" }
acorn-tui = { version = "0.2.0", path = "../acorn-tui", optional = true }
arboard = { workspace = true }
bon = "3.3.2"
jiff = { workspace = true, features = ["std"] }
chromiumoxide = { version = "0.9.1", features = ["fetcher", "rustls", "zip8"], optional = true }
clap = { version = "4.4.2", features = ["derive", "unstable-doc"] }
clap-markdown = { version = "0.1.5" }
clap-verbosity-flag = "3.0.2"
color-eyre = { workspace = true }
crossterm = { version = "0.28", features = ["event-stream"] }
data-encoding = { workspace = true }
derive_more = { workspace = true }
directories = { workspace = true }
dotenvy = { workspace = true }
exitcode = { version = "1.1.2", default-features = false }
fancy-regex = { workspace = true }
fast_qr = { version = "0.13.0", features = ["image"], optional = true }
futures = { workspace = true }
indicatif = { workspace = true }
is-terminal = "0.4.16"
itertools = { workspace = true }
lazy_static = { workspace = true }
keyring = { version = "3.0.5", default-features = true }
nanoid = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
owo-colors = { workspace = true }
percy-dom = { version = "0.10.0", optional = true }
quick-xml = { workspace = true }
rayon = { workspace = true }
reqwest = { version = "0.13.2", features = ["blocking", "rustls", "json"], default-features = false }
rusqlite = { workspace = true, features = ["bundled"] }
rust-embed = { workspace = true }
secrecy = { workspace = true }
veil = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
eserde = { workspace = true }
serde_with = { version = "3.15.1", default-features = false }
serde_norway = { workspace = true }
strum = { workspace = true }
sophia = { workspace = true }
tera = { workspace = true }
tokio = { workspace = true, features = ["rt", "signal", "sync", "time"] }
tracing = { workspace = true }
triomphe = { workspace = true }
tracing-indicatif = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
fluent-uri = { workspace = true }
rhai = { workspace = true, optional = true }
urlencoding = { version = "2.1.3", default-features = false }
which = { version = "8.0.0", features = ["real-sys"], default-features = false }

[target.'cfg(target_env = "musl")'.dependencies]
openssl-sys = { version = "0.9.117", features = ["vendored"] }

[features]
default = ["pdf", "tui"]
chart = ["acorn-lib/chart"]
duckdb = ["acorn-lib/duckdb"]
grpc = ["acorn-lib/grpc"]
pdf = ["dep:chromiumoxide", "dep:percy-dom", "dep:fast_qr", "chart"]
tui = ["dep:acorn-tui"]
exec = ["acorn-lib/exec", "dep:rhai"]

[dev-dependencies]
assert_cmd = "2.0.16"
insta = { workspace = true }
mockall = "0.14.0"
pretty_assertions = "1.4.1"
temp-env = "0.3.6"
tempfile = "3"

[lints]
workspace = true
