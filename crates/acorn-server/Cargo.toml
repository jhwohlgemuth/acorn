[package]
name = "acorn-server"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
description = "Authenticated JSON-RPC and typed gRPC server for ACORN"
documentation.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
acorn-analysis = { workspace = true, features = ["std"] }
acorn-core = { workspace = true, features = ["std"] }
acorn-service = { workspace = true, features = ["std"] }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
axum-server = { workspace = true }
clap = { version = "4.4.2", features = ["derive", "env"] }
futures = { workspace = true }
prost = { workspace = true }
reqwest = { version = "0.13.2", features = ["rustls", "stream"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[build-dependencies]
protoc-bin-vendored = { workspace = true }
tonic-prost-build = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
