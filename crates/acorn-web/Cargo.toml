[package]
name = "acorn-web"
publish = false
exclude.workspace = true
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ACORN Research Intelligence browser application"

[package.metadata.cargo-shear]
# This enables the JS entropy backend for rustworkx-core's transitive rand dependency.
ignored = ["getrandom"]

[dependencies]
acorn-analysis = { workspace = true, default-features = false, features = ["alloc"] }
acorn-core = { workspace = true, features = ["alloc"] }
acorn-macros = { workspace = true, default-features = false }
acorn-schema.workspace = true
acorn-wasm = { path = "../acorn-wasm" }
case = "1.0.0"
data-encoding.workspace = true
dioxus = { version = "=0.7.10", features = ["web", "router"] }
js-sys = "0.3.105"
jsonc-parser.workspace = true
regex.workspace = true
rust-embed = { workspace = true, features = ["debug-embed"] }
rustworkx-core.workspace = true
serde.workspace = true
serde-wasm-bindgen = "0.6.5"
serde_json.workspace = true
serde_norway.workspace = true
strum.workspace = true
tracing.workspace = true
wasm-bindgen = "0.2.128"

[features]
default = []
js-lint = ["acorn-macros/js-lint"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.2", features = ["wasm_js"] }

[lints]
workspace = true

[dev-dependencies]
wasm-bindgen-test = "0.3.78"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.9.0"
