<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ACORN Research Intelligence: local tools for Research Activity Data">
<link rel="icon" href="data:,">
<style>
html{background:#1f2229;color:#abb2bf}
#main:not([data-styles-ready]){visibility:hidden}
#main[data-styles-ready]:has(.workspace)+#boot{display:none}
html[data-loader-preview] #main{visibility:hidden}
html[data-loader-preview] #main[data-styles-ready]:has(.workspace)+#boot{display:grid}
#boot{position:fixed;inset:0;display:grid;place-content:center;gap:12px;justify-items:center;font:15px system-ui,sans-serif;background:#1f2229;color:#abb2bf}
#boot img{display:block;width:180px;height:180px;color-scheme:light}
#boot span{max-width:calc(100vw - 48px);font-size:19px;line-height:1.2;text-align:center}
#boot button{font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:5px;padding:7px 12px;cursor:pointer}
@media (prefers-color-scheme:light){html,#boot{background:#f7f8fa;color:#242931}}
html[data-theme=light],html[data-theme=light] #boot{background:#f7f8fa;color:#242931}
html[data-theme=dark],html[data-theme=dark] #boot{background:#1f2229;color:#abb2bf}
html[data-theme=dark] #boot img{color-scheme:dark}
html[data-theme=uswds],html[data-theme=uswds] #boot{background:#fff;color:#1b1b1b;color-scheme:light}
</style>
<script>
if (new URLSearchParams(location.search).get('preview-loader') === '1') document.documentElement.setAttribute('data-loader-preview', '');
window.acornThemeOverride = new URLSearchParams(location.search).get('theme');
window.acornInitialEditorId = new URLSearchParams(location.search).get('acorn-editor') || /^acorn-editor:([^:]+):/.exec(window.name)?.[1] || '';
if (!['dark', 'light', 'uswds'].includes(window.acornThemeOverride)) window.acornThemeOverride = '';
window.acornInitialThemeMode = 'system';
try {
    const savedTheme = localStorage.getItem('acorn.theme.v1');
    if (['dark', 'light', 'system', 'uswds'].includes(savedTheme)) window.acornInitialThemeMode = savedTheme;
} catch {}
const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
window.acornInitialTheme = 'light';
if (window.acornInitialThemeMode === 'dark' || (window.acornInitialThemeMode === 'system' && systemDark)) window.acornInitialTheme = 'dark';
if (window.acornInitialThemeMode === 'uswds') window.acornInitialTheme = 'uswds';
if (window.acornThemeOverride) window.acornInitialTheme = window.acornThemeOverride;
document.documentElement.dataset.theme = window.acornInitialTheme;
window.acornInitialReviewFragment = '';
if (/\/(review|metadata|research-activity|metadata-standard)$/.test(location.pathname)) window.acornInitialReviewFragment = location.hash.slice(1);
try { window.acornInitialSidebarCollapsed = sessionStorage.getItem('acorn-sidebar-collapsed') === 'true'; }
catch { window.acornInitialSidebarCollapsed = false; }
const markStylesReady = () => {
    const main = document.getElementById('main');
    if (main) main.setAttribute('data-styles-ready', '');
    else document.addEventListener('DOMContentLoaded', markStylesReady, { once: true });
};
const showStylesError = () => {
    const boot = document.getElementById('boot');
    if (!boot) {
        document.addEventListener('DOMContentLoaded', showStylesError, { once: true });
        return;
    }
    boot.setAttribute('role', 'alert');
    boot.removeAttribute('aria-label');
    const loader = boot.querySelector('img');
    if (loader) loader.remove();
    boot.querySelector('span').textContent = 'ACORN styles could not load.';
    const retry = document.createElement('button');
    retry.textContent = 'Retry';
    retry.onclick = () => location.reload();
    boot.append(retry);
};
window.markStylesReady = markStylesReady;
window.showStylesError = showStylesError;
const watchAppStylesheet = () => {
    const initial = document.getElementById('initial-app-stylesheet');
    if (initial) {
        if (initial.sheet) markStylesReady();
        return true;
    }
    const stylesheet = document.getElementById('app-stylesheet');
    if (!stylesheet) return false;
    if (stylesheet.sheet) markStylesReady();
    else {
        stylesheet.addEventListener('load', markStylesReady, { once: true });
        stylesheet.addEventListener('error', showStylesError, { once: true });
    }
    return true;
};
if (!watchAppStylesheet()) new MutationObserver((_, observer) => {
    if (watchAppStylesheet()) observer.disconnect();
}).observe(document.head, { childList: true, subtree: true });
</script>
</head>
<body><div id="main"></div><div id="boot" role="status" aria-label="Loading ACORN Research Intelligence"><img src="/{base_path}/assets/acorn-loader.svg" alt=""><span>Plant an acorn, grow your science 🌱</span></div><script>document.querySelector('#boot img').src += document.documentElement.dataset.theme === 'dark' ? '#theme-dark' : '#theme-light';</script><noscript>ACORN Research Intelligence requires JavaScript and WebAssembly.</noscript></body>
</html>
