[package]
name = "acorn-service"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors.workspace = true
description = "Portable application service boundary for ACORN"
documentation.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
acorn-analysis = { workspace = true, default-features = false }
acorn-core = { workspace = true, default-features = false }
acorn-schema = { workspace = true, default-features = false }
futures = { workspace = true }
schemars = { version = "1.0.4", features = ["derive"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }

[features]
alloc = ["acorn-analysis/alloc", "acorn-core/alloc", "acorn-schema/alloc", "serde/alloc"]
default = ["std"]
std = ["alloc", "acorn-analysis/std", "acorn-core/std", "acorn-schema/std", "schemars/std"]

[dev-dependencies]
futures = { version = "0.3.32", features = ["executor"] }

[lints]
workspace = true
