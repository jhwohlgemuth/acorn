[package]
name = "acorn-cmd"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
description = "Command construction and execution utilities for ACORN"
documentation.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
acorn-macros = { version = "0.3.0", path = "../acorn-macros" }
shell-words = { workspace = true }
shuck-linter = { version = "0.0.41", optional = true }
shuck-parser = { version = "0.0.41", optional = true }
tracing = { workspace = true }

[dev-dependencies]
temp-env = "0.3.6"

[features]
default = []
shell-lint = ["dep:shuck-linter", "dep:shuck-parser"]

[lints]
workspace = true
