[package]
name = "acorn-cmd"
version.workspace = true
edition = "2021"
license.workspace = true
authors.workspace = true
description = "Command construction and execution utilities for ACORN"
documentation.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.cargo-shear]
ignored-paths = ["tests/fixtures/process_helper.rs"]

[dependencies]
acorn-macros = { version = "0.5.3", path = "../acorn-macros", default-features = false }
command-group = { workspace = true }
shell-words = { workspace = true }
shuck-linter = { version = "0.0.41", optional = true }
shuck-parser = { version = "0.0.41", optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
temp-env = "0.3.6"

[features]
default = []
shell-lint = ["dep:shuck-linter", "dep:shuck-parser"]

[lints]
workspace = true
