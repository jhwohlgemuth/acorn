[package]
edition = "2021"
name = "acorn-lib"
version.workspace = true
readme = "README.md"
description = "ACORN library"
repository = "https://code.ornl.gov/research-enablement/acorn"
categories = [
  "command-line-utilities",
  "data-structures",
  "development-tools",
  "parsing",
  "science",
]
authors.workspace = true
documentation.workspace = true
keywords.workspace = true
license.workspace = true

[lib]
name = "acorn"
bench = false

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
acorn-analysis = { workspace = true, optional = true }
acorn-cmd = { version = "0.5.0", path = "../acorn-cmd", default-features = false, optional = true }
acorn-core = { version = "0.5.0", path = "../acorn-core", default-features = false }
acorn-diff = { version = "0.5.0", path = "../acorn-diff", default-features = false, optional = true }
acorn-host = { version = "0.5.0", path = "../acorn-host", default-features = false }
acorn-macros = { version = "0.5.0", path = "../acorn-macros" }
acorn-schema = { version = "0.5.0", path = "../acorn-schema", default-features = false }
acorn-service = { workspace = true, features = ["alloc"], optional = true }
agent-client-protocol = { workspace = true, optional = true }
anydoc = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }
ariadne = { version = "0.6.0", features = ["auto-color"], default-features = false, optional = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, features = ["http1", "json", "tokio"], optional = true }
bat = { version = "0.26.0", features = ["regex-onig"], default-features = false, optional = true }
bon = { workspace = true }
cap-std = { version = "4.0.3", default-features = false, optional = true }
jiff = { workspace = true }
color-eyre = { workspace = true, optional = true }
comfy-table = { version = "7.1.4", default-features = false, features = ["tty", "custom_styling"], optional = true }
console = { version = "0.16.1", features = ["ansi-parsing"], default-features = false, optional = true }
convert_case = { version = "0.11.0", default-features = false }
data-encoding = { workspace = true }
derive_more = { workspace = true }
directories = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
duckdb = { workspace = true, features = ["bundled"], default-features = false, optional = true }
fancy-regex = { workspace = true }
flate2 = { version = "1.1.5", default-features = false, optional = true }
futures = { workspace = true, optional = true }
glob = { workspace = true, optional = true }
http = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }
is_executable = { version = "1.0.5", default-features = false, optional = true }
itertools = { workspace = true }
jsonc-parser = { workspace = true }
jsonschema = { workspace = true, optional = true }
lazy_static = { workspace = true }
lychee-lib = { version = "0.23.0", default-features = false, optional = true }
nanoid = { workspace = true, optional = true }
owo-colors = { workspace = true, optional = true }
pdf-inspector = { workspace = true, optional = true }
polars = { version = "0.53.0", features = ["fmt_no_tty", "rows"], default-features = false, optional = true }
polars-error = { version = "0.53.0", default-features = false, optional = true }
quick-xml = { workspace = true, features = ["serialize"] }
rayon = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
reqwest = { version = "0.13.2", features = ["blocking", "rustls", "json"], default-features = false, optional = true }
resvg = { version = "0.45.1", optional = true }
ring = { version = "0.17.14", default-features = false, optional = true }
rand = { version = "0.8", features = ["std_rng"], optional = true }
rsa = { version = "0.9.10", default-features = false, optional = true }
rusqlite = { workspace = true, features = ["bundled"], default-features = false, optional = true }
rust-ini = { version = "0.21.3", default-features = false, optional = true }
same-file = { version = "1.0.6", optional = true }
schemars = { version = "1.0.4", features = ["derive"], default-features = false}
strum = { workspace = true }
secrecy = { workspace = true }
veil = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
eserde = { workspace = true }
serde_with = { version = "3.15.1", features = ["macros"], default-features = false }
serde_norway = { workspace = true }
sevenz-rust2 = { workspace = true, optional = true }
similar = { workspace = true, optional = true }
swhid = { workspace = true, features = ["git"], optional = true }
sysinfo = { version = "0.38.2", features = ["network", "system"], default-features = false, optional = true}
tar = { version = "0.4.45", default-features = false, optional = true }
tera = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true, features = ["timeout", "util"] }
tracing = { workspace = true }
fluent-uri = { workspace = true }
urlencoding = { version = "2.1.3", default-features = false}
which = { version = "8.0.0", features = ["real-sys"], default-features = false, optional = true }
zip = { version = "8.5.1", features = ["deflate"], default-features = false, optional = true }
zstd = { version = "0.13.3", default-features = false, optional = true }
rhai = { workspace = true, optional = true }
validator = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "json", "tokio"] }
criterion = "0.8.2"
indicatif = { workspace = true, features = ["in_memory"] }
insta = { workspace = true, features = ["json", "yaml"] }
owo-colors = { workspace = true }
proptest = "1.9.0"
similar-asserts = "2.0.0"
temp-env = "0.3.6"
tempfile = "3"
tracing-subscriber = { workspace = true, features = ["fmt"] }

[[bench]]
name = "research_activity"
harness = false

[[bench]]
name = "document"
harness = false

[[bench]]
name = "vocabulary"
harness = false

[[test]]
name = "acp_interoperability"
path = "tests/acp_interoperability.rs"
required-features = ["acp", "analysis"]

[[test]]
name = "network"
path = "tests/network.rs"
required-features = ["analysis"]

[[test]]
name = "openai_interoperability"
path = "tests/openai_interoperability.rs"
required-features = ["analysis"]

[features]
acp = ["std", "dep:acorn-cmd", "dep:agent-client-protocol", "dep:thiserror", "dep:tokio", "tokio/rt", "tokio/time"]
core = ["acorn-core/core", "acorn-schema/core"]
alloc = ["core", "acorn-core/alloc", "acorn-schema/alloc", "serde/alloc", "jiff/alloc"]
wasm = ["alloc", "acorn-schema/alloc"]
std = ["alloc", "acorn-schema/alloc", "jiff/std", "schemars/std", "dep:color-eyre"]
net = ["std", "dep:reqwest", "dep:http", "dep:httpdate", "dep:jsonschema", "dep:lychee-lib", "dep:thiserror", "dep:tokio", "tokio/io-std", "tokio/io-util", "tokio/net", "tokio/rt", "tokio/signal", "tokio/time", "dep:futures", "dep:async-trait", "dep:nanoid", "dep:rand", "dep:ring", "dep:rsa", "dep:glob", "dep:tower"]
archive = ["std", "dep:flate2", "dep:zip", "dep:tar", "dep:zstd", "dep:sevenz-rust2"]
template = ["std", "acorn-schema/std", "dep:tera", "dep:anydoc", "dep:pdf-inspector"]
progress = ["std", "dep:indicatif", "dep:console", "dep:owo-colors", "dep:comfy-table", "dep:similar"]
cli = ["std", "dep:directories", "dep:dotenvy", "dep:which", "dep:is_executable", "dep:glob", "dep:arboard"]
db = ["std", "dep:rusqlite"]
unicode = ["std", "console/std"]
agentic = ["analysis", "dep:axum", "dep:rmcp", "dep:tower", "rmcp/server", "rmcp/transport-io"]
analysis = [
  "dep:acorn-analysis",
  "dep:acorn-service",
  "acorn-analysis/analysis",
  "acorn-core/std",
  "acorn-diff/std",
  "acorn-host/config",
  "acorn-host/fs",
  "acorn-host/http",
  "acorn-host/source",
  "acorn-host/terminal",
  "dep:acorn-cmd",
  "dep:acorn-diff",
  "archive",
  "cli",
  "db",
  "net",
  "progress",
  "template",
  "unicode",
  "dep:ariadne",
  "dep:bat",
  "dep:polars-error",
  "dep:rayon",
  "dep:rust-ini",
  "dep:same-file",
]
chart = ["analysis", "dep:resvg"]
dataframe = ["analysis", "dep:polars"]
default = ["std"]
diagnostics = ["analysis", "dep:sysinfo"]
duckdb = ["analysis", "dep:duckdb"]
powerpoint = ["analysis"]
mcp-client = [
  "std",
  "dep:acorn-service",
  "acorn-service/alloc",
  "dep:http",
  "dep:rmcp",
  "dep:reqwest",
  "dep:tokio",
  "dep:which",
  "rmcp/client",
  "rmcp/reqwest",
  "rmcp/transport-child-process",
  "rmcp/transport-streamable-http-client-reqwest",
  "tokio/process",
  "tokio/rt",
  "tokio/rt-multi-thread",
  "tokio/time",
]
needle = ["agentic", "dep:acorn-cmd"]
exec = ["analysis", "acorn-analysis/exec", "dep:cap-std", "dep:rhai"]
shell-lint = ["analysis", "acorn-cmd/shell-lint"]
swhid-compute = ["analysis", "dep:acorn-cmd", "dep:swhid"]

[lints]
workspace = true
