[package]
edition = "2021"
name = "acorn-lib"
readme = "README.md"
description = "ACORN utility library"
repository = "https://code.ornl.gov/research-enablement/acorn"
categories = [
  "command-line-utilities",
  "data-structures",
  "development-tools",
  "parsing",
  "science",
]
authors.workspace = true
documentation.workspace = true
keywords.workspace = true
license.workspace = true
version.workspace = true

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
aho-corasick = "1.1.3"
bat = "0.25.0"
bon = "3.3.2"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.4.2", features = ["derive", "unstable-doc"] }
comfy-table = "7.1.4"
console = { version = "0.16.0", features = ["ansi-parsing"] }
directories = "6.0.0"
eserde = { version = "0.1.2", features = ["json"] }
fancy-regex = "0.14.0"
flate2 = "1.0.35"
human-units = "0.3.0"
is_executable = "1.0.4"
nanoid = "0.4.0"
nanopub = "0.1.4"
nucleo-matcher = "0.3.1"
percy-dom = "0.10.0"
petgraph = "0.8.1"
quick-xml = { version = "0.38.0", features = ["serialize"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
ring = "0.17.13"
rust-ini = "0.21.1"
schemars = "1.0.3"
serde_trim = "1.1.0"
serde_with = "3.12.0"
similar = "2.7.0"
sophia = "0.9.0"
sophia_jsonld = "0.9.0"
sysinfo = "0.35.0"
tar = "0.4.43"
titlecase = "3.4.0"
urlencoding = "2.1.3"
validator = { version = "0.20", features = ["derive"] }
wgpu = "25.0.0"
which = "8.0.0"
zip = "4.2.0"
color-eyre = { workspace = true }
data-encoding = { workspace = true }
derive_more = { workspace = true }
dotenvy = { workspace = true }
duct = { workspace = true }
exitcode = { workspace = true }
glob = { workspace = true }
indicatif = { workspace = true }
lazy_static = { workspace = true }
owo-colors = { workspace = true }
rayon = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
serde_yml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uriparse = { workspace = true }
itertools = "0.14.0"
lychee-lib = "0.20.1"

[target.'cfg(unix)'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10" }

[dev-dependencies]
mockall = "0.13.1"
pretty_assertions = "1.4.1"

[features]
cli = []

[lints]
workspace = true
