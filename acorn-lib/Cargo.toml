[package]
edition = "2021"
name = "acorn-lib"
readme = "README.md"
description = "ACORN library"
repository = "https://code.ornl.gov/research-enablement/acorn"
categories = [
  "command-line-utilities",
  "data-structures",
  "development-tools",
  "parsing",
  "science",
]
authors.workspace = true
documentation.workspace = true
keywords.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "acorn"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
acorn-macros = { path = "../acorn-macros" }
aho-corasick = { version = "1.1.4", default-features = false }
ariadne = { version = "0.6.0", features = ["auto-color"], default-features = false }
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
bat = { version = "0.26.0", features = ["regex-onig"], default-features = false, optional = true }
bon = { version = "3.8.1", default-features = false }
chrono = { workspace = true }
color-eyre = { workspace = true }
comfy-table = { version = "7.1.4", default-features = false }
console = { version = "0.16.1", features = ["ansi-parsing"], default-features = false }
convert_case = { version = "0.11.0", default-features = false }
data-encoding = { workspace = true }
derive_more = { workspace = true }
directories = { version = "6.0.0", default-features = false }
dotenvy = { workspace = true }
docx-rs = { workspace = true }
duckdb = { workspace = true, features = ["bundled"], default-features = false, optional = true }
fancy-regex = { workspace = true }
flate2 = { version = "1.1.5", default-features = false }
futures = { workspace = true }
glob = { workspace = true }
hashbrown = { version = "0.17.0", features = ["default-hasher", "serde"], default-features = false }
human-units = { version = "0.5.3", default-features = false }
indicatif = { version = "0.18.2", default-features = false }
is_executable = { version = "1.0.5", default-features = false }
itertools = { workspace = true }
lazy_static = { workspace = true }
lychee-lib = { version = "0.23.0", default-features = false, optional = true }
nanoid = { workspace = true }
nucleo-matcher = { version = "0.3.1", features = ["unicode-casefold", "unicode-normalization"] , default-features = false }
owo-colors = { workspace = true }
percy-dom = {version = "0.10.0", features = ["macro"], default-features = false }
petgraph = { version = "0.8.3", features = ["stable_graph"], default-features = false }
polars = { version = "0.53.0", features = ["lazy", "fmt_no_tty", "csv"], default-features = false, optional = true }
quick-xml = { version = "0.39.1", features = ["serialize"], default-features = false }
rayon = { workspace = true }
rmcp = { workspace = true, optional = true }
reqwest = { version = "0.13.2", features = ["rustls", "json"], default-features = false, optional = true }
ring = { version = "0.17.14", default-features = false }
rusqlite = { workspace = true, features = ["bundled"], default-features = false }
rust-embed = { workspace = true }
rust-ini = { version = "0.21.3", default-features = false }
schemars = { version = "1.0.4", features = ["derive"], default-features = false}
strum = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
serde_trim = { version = "1.1.0", default-features = false }
serde_with = { version = "3.15.1", features = ["macros"], default-features = false }
serde_yml = { workspace = true }
similar = { version = "3.1.0", features = ["text"], default-features = false}
sophia = { workspace = true }
sysinfo = { version = "0.38.2", features = ["network", "system"], default-features = false}
tar = { version = "0.4.45", default-features = false }
tera = { workspace = true }
tokio = { version = "1.48.0", default-features = false, features = ["rt"], optional = true }
tracing = { workspace = true }
tower = { workspace = true, optional = true, features = ["timeout", "util"] }
triomphe = { workspace = true }
uriparse = { workspace = true }
urlencoding = { version = "2.1.3", default-features = false}
exitcode = { version = "1.1.2", default-features = false }
validator = { workspace = true }
which = { version = "8.0.0", features = ["real-sys"], default-features = false, optional = true }
zip = { version = "8.5.1", features = ["deflate"], default-features = false }

[dev-dependencies]
insta = { workspace = true, features = ["json", "yaml"] }
mockall = "0.14.0"
pretty_assertions = "1.4.1"
similar-asserts = "2.0.0"
temp-env = "0.3.6"
zench = "0.2.0"

[features]
agentic = ["dep:axum", "dep:rmcp", "dep:tower"]
analysis = ["dep:bat", "dep:polars", "std"]
default = ["analysis", "agentic", "std"]
doctor = []
duckdb = ["dep:duckdb"]
powerpoint = []
std = ["dep:axum", "dep:lychee-lib", "dep:reqwest", "dep:tokio", "dep:tower", "dep:which", "chrono/std", "chrono/clock"]

[lints]
workspace = true
