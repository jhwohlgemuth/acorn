[package]
edition = "2021"
name = "acorn-cli"
readme = "README.md"
description = "ACORN command line interface"
repository = "https://code.ornl.gov/research-enablement/acorn"
categories = ["command-line-interface", "science"]
authors.workspace = true
documentation.workspace = true
keywords.workspace = true
license-file.workspace = true
version.workspace = true

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
acorn-lib = { path = "../acorn-lib", features = ["cli"] }
clap = { version = "4.4.2", features = ["derive", "unstable-doc"] }
clap-verbosity-flag = "3.0.2"
dotenvy = "0.15.0"
fast_qr = { version = "0.12.7", features = ["image"] }
percy-dom = "0.10.0"
playwright = "0.0.20"
color-eyre = { workspace = true }
data-encoding = { workspace = true }
derive_more = { workspace = true }
exitcode = { workspace = true }
glob = { workspace = true }
indicatif = { workspace = true }
lazy_static = { workspace = true }
owo-colors = { workspace = true }
rayon = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-indicatif.workspace = true
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
uriparse = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0.16"
pretty_assertions = "1.4.1"

[lints]
workspace = true
