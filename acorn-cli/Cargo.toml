[package]
name = "acorn-cli"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation.workspace = true
edition = "2021"

[dependencies]
acorn-lib = { path = "../acorn-lib" }
clap = { version = "4.4.2", features = ["derive", "unstable-doc"] }
console = { version = "0.15.7", default-features = false, features = [
    "ansi-parsing",
] }
data-encoding = "2.7.0"
derive_more = { version = "2.0.1", features = ["display", "from_str"] }
fast_qr = { version = "0.12.7", features = ["image"] }
glob = "0.3.1"
indicatif = "0.17.6"
lazy_static = "1.5.0"
once_cell = "1.20.2"
percy-dom = "0.10.0"
playwright = "0.0.20"
rust-embed = "8.5.0"
assert_cmd = { workspace = true }
clap-verbosity-flag = { workspace = true }
color-eyre = { workspace = true }
dotenvy = { workspace = true }
exitcode = { workspace = true }
owo-colors = { workspace = true }
pretty_assertions = { workspace = true }
rayon = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-indicatif.workspace = true
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
uriparse = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
