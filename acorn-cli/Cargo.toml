[package]
edition = "2021"
name = "acorn-cli"
readme = "../README.md"
description = "ACORN command line interface"
repository = "https://code.ornl.gov/research-enablement/acorn"
categories = ["command-line-interface", "science"]
authors.workspace = true
documentation.workspace = true
keywords.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "acorn"
path = "src/main.rs"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
acorn-lib = { version = "0.1.30", path = "../acorn-lib", features = ["cli"] }
bon = "3.3.2"
clap = { version = "4.4.2", features = ["derive", "unstable-doc"] }
clap-verbosity-flag = "3.0.2"
fast_qr = { version = "0.13.0", features = ["image"] }
percy-dom = "0.10.0"
playwright = "0.0.20"
color-eyre = { workspace = true }
data-encoding = { workspace = true }
derive_more = { workspace = true }
dotenvy = { workspace = true }
duct = { workspace = true }
exitcode = { workspace = true }
indicatif = { workspace = true }
owo-colors = { workspace = true }
rayon = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
tracing = { workspace = true }
tracing-indicatif.workspace = true
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0.16"
mockall = "0.13.1"
pretty_assertions = "1.4.1"

[lints]
workspace = true
