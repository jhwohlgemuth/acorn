[package]
edition = "2021"
name = "acorn-cli"
readme = "../README.md"
description = "ACORN command line interface"
repository = "https://code.ornl.gov/research-enablement/acorn"
categories = ["command-line-interface", "science"]
authors.workspace = true
documentation.workspace = true
keywords.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "acorn"
path = "src/main.rs"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
acorn-lib = { version = "0.1.58", path = "../acorn-lib", features = ["doctor", "powerpoint"] }
acorn-tui = { version = "0.1.58", path = "../acorn-tui", optional = true }
bon = "3.3.2"
chrono = { workspace = true, features = ["std", "clock"] }
clap = { version = "4.4.2", features = ["derive", "unstable-doc"] }
clap-markdown = { version = "0.1.5" }
clap-verbosity-flag = "3.0.2"
color-eyre = { workspace = true }
data-encoding = { workspace = true }
derive_more = { workspace = true }
dotenvy = { workspace = true }
exitcode = { version = "1.1.2", default-features = false }
fancy-regex = { workspace = true }
fast_qr = { version = "0.13.0", features = ["image"] }
futures = { workspace = true }
indicatif = { version = "0.18.2", default-features = false }
is-terminal = "0.4.16"
itertools = { workspace = true }
lazy_static = { workspace = true }
keyring = { version = "3.0.5", default-features = true }
nanoid = { workspace = true }
owo-colors = { workspace = true }
percy-dom = "0.10.0"
playwright = { version = "0.0.20", optional = true }
rayon = { workspace = true }
reqwest = { version = "0.13.2", features = ["blocking", "rustls", "json"], default-features = false }
rusqlite = { workspace = true, features = ["bundled"] }
rust-embed = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
eserde = { workspace = true }
serde_with = { version = "3.15.1", default-features = false }
serde_norway = { workspace = true }
strum = { workspace = true }
sophia = { workspace = true }
tera = { workspace = true }
tokio = { version = "1.48.0", default-features = false, features = ["rt"] }
tracing = { workspace = true }
triomphe = { workspace = true }
tracing-indicatif = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
fluent-uri = { workspace = true }
urlencoding = { version = "2.1.3", default-features = false }
validator = { workspace = true }
which = { version = "8.0.0", features = ["real-sys"], default-features = false }

[features]
default = ["pdf", "tui"]
duckdb = ["acorn-lib/duckdb"]
pdf = ["dep:playwright"]
tui = ["dep:acorn-tui"]

[dev-dependencies]
assert_cmd = "2.0.16"
insta = { workspace = true }
mockall = "0.14.0"
pretty_assertions = "1.4.1"

[lints]
workspace = true
