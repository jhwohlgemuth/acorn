[package]
name = "acorn-py"
version = "0.1.33"
license = "MIT"
authors = ["Jason Wohlgemuth <wohlgemuthjh@ornl.gov>"]
description = "Python bindings for acorn-lib crate"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
acorn-lib = { path = "../acorn-lib" }
pyo3 = { version = "0.26.0", features = ["abi3-py310", "extension-module"] }
rand = "0.9.2"

[workspace]
