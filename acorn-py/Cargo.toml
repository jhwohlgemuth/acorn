[package]
name = "acorn-py"
version.workspace = true
license = "MIT"
authors = ["Jason Wohlgemuth <wohlgemuthjh@ornl.gov>"]
description = "Python bindings for acorn-lib crate"
documentation.workspace = true
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
acorn-lib = { version = "0.1.57", path = "../acorn-lib" }
pyo3 = { version = "0.28.0", features = ["abi3-py310", "extension-module"] }
rand = "0.9.3"
