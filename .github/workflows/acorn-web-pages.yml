name: Deploy ACORN browser to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acorn-web-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jhwohlgemuth/acorn' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: crates/acorn-web/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/tools/dioxus
          key: dioxus-0.7.3-${{ runner.os }}-${{ runner.arch }}
      - name: Set up browser tools
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown
          if [ ! -x target/tools/dioxus/bin/dx ]; then make web-setup; fi
          npm ci --prefix crates/acorn-web
          cd crates/acorn-web
          npx playwright install --with-deps --only-shell chromium
      - name: Check application publication policy
        run: make check-release-apps
      - name: Build Pages site
        env:
          WEB_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: make web-pages
      - name: Test navigation and direct routes
        env:
          WEB_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: make web-test-pages
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/dx/acorn-web/release/web/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
